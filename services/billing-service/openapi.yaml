openapi: 3.0.0
info:
  title: PulseWard Billing Service API
  description: API for managing billing and payments within the PulseWard Hospital Management System.
  version: 1.0.0
servers:
  - url: http://localhost:5000
    description: Development server
paths:
  /billing:
    get:
      summary: Retrieve all billing records
      description: Return all billing records currently stored by the service.
      responses:
        "200":
          description: Successful retrieval of billing records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BillingRecord"
    post:
      summary: Create a billing record
      description: Create a new billing record for a patient.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingCreateRequest"
      responses:
        "201":
          description: Billing record created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingRecord"

  /billing/{id}:
    get:
      summary: Retrieve a billing record by ID
      parameters:
        - name: id
          in: path
          required: true
          description: Billing record ID
          schema:
            type: integer
      responses:
        "200":
          description: Billing record retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingRecord"
        "404":
          description: Billing record not found
    put:
      summary: Update a billing record
      parameters:
        - name: id
          in: path
          required: true
          description: Billing record ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingUpdateRequest"
      responses:
        "200":
          description: Billing record updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingRecord"
        "404":
          description: Billing record not found
    delete:
      summary: Delete a billing record
      parameters:
        - name: id
          in: path
          required: true
          description: Billing record ID
          schema:
            type: integer
      responses:
        "204":
          description: Billing record deleted successfully
        "404":
          description: Billing record not found

components:
  schemas:
    BillingRecord:
      type: object
      properties:
        id:
          type: integer
        patientId:
          type: string
        amount:
          type: number
          format: float
        status:
          type: string
        createdAt:
          type: string
          format: date-time
    BillingCreateRequest:
      type: object
      required:
        - patientId
        - amount
        - status
      properties:
        patientId:
          type: string
        amount:
          type: number
          format: float
        status:
          type: string
    BillingUpdateRequest:
      type: object
      properties:
        amount:
          type: number
          format: float
        status:
          type: string
