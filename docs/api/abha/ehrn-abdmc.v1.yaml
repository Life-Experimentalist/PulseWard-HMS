                          description: ABHA address of the Patient
                    careContext:
                      type: object
                      properties:
                        patientReference:
                          type: string
                          format: uuid
                          description: Id of the Patient(UUID recommended)
                        careContextReference:
                          type: string
                          format: uuid
                          description: Id of the careCOntext(UUID recommended)
                    hiTypes:
                      type: array
                      items:
                        $ref: "#/components/schemas/hiTypes"
                    date:
                      type: string
                      format: date-time
                    hip:
                      type: object
                      properties:
                        id:
                          type: string
                          description: HIP Id
            examples:
              Example 1:
                value:
                  notification:
                    patient:
                      id: user_122@sbx
                    careContext:
                      patientReference: f1b07f3d-57ef-4074-8978-bbb407ebabbb
                      careContextReference: 5be0e660-e794-4281-b50b-f94e68b20736
                    hiTypes:
