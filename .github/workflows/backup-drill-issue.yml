name: Backup Drill Issue

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  issues: write
  contents: read

jobs:
  create-backup-drill-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create weekly backup verification issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = '[Operations] Weekly backup verification checklist';
            const body = fs.readFileSync('docs/runbooks/templates/backup-verification-issue.md', 'utf8');

            const openIssues = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              per_page: 100
            });

            const alreadyOpen = openIssues.data.some((i) => i.title === title);
            if (alreadyOpen) {
              core.info('Backup checklist issue already open; skipping create.');
              return;
            }

            await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              labels: ['operations', 'backup', 'triage']
            });
