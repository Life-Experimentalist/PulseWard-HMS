openapi: 3.0.0
info:
  title: Appointment Service API
  description: API for managing patient appointments in the PulseWard Hospital Management System.
  version: 1.2.0
servers:
  - url: http://localhost:3000/api/v1
paths:
  /appointments:
    get:
      summary: Retrieve all appointments
      responses:
        "200":
          description: A list of appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Appointment"
    post:
      summary: Create a new appointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentCreateRequest"
      responses:
        "201":
          description: Appointment created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "400":
          description: Invalid appointment payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "403":
          description: Appointment entry blocked for role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentRoleErrorResponse"
  /appointments/{id}:
    get:
      summary: Retrieve a specific appointment by ID
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the appointment to retrieve
          schema:
            type: string
      responses:
        "200":
          description: Appointment details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "404":
          description: Appointment not found
    put:
      summary: Update an existing appointment
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the appointment to update
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentUpdateRequest"
      responses:
        "200":
          description: Appointment updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "400":
          description: Invalid update payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "403":
          description: Appointment update blocked for role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentRoleErrorResponse"
        "404":
          description: Appointment not found
    delete:
      summary: Delete an appointment
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the appointment to delete
          schema:
            type: string
      responses:
        "204":
          description: Appointment deleted successfully
        "400":
          description: Missing actor role for appointment cancel action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentRoleErrorResponse"
        "403":
          description: Appointment cancel blocked for role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentRoleErrorResponse"
        "404":
          description: Appointment not found
  /opd/entries:
    get:
      summary: List OPD intake entries with optional filters
      parameters:
        - name: tenantKey
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: triageLevel
          in: query
          required: false
          schema:
            type: string
            enum: [low, medium, high, critical]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: OPD entry list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpdEntriesListResponse"
    post:
      summary: Create OPD intake entry and optional appointment draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpdEntryCreateRequest"
      responses:
        "201":
          description: OPD entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpdEntryCreateResponse"
        "400":
          description: Invalid OPD intake payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "403":
          description: OPD intake blocked for role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentRoleErrorResponse"
  /integrations/calendars/providers:
    get:
      summary: List calendar providers for a tenant
      parameters:
        - name: tenantKey
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Calendar providers for the tenant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarProviderStatus"
  /integrations/calendars/test:
    post:
      summary: Test calendar provider booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarProviderTestRequest"
      responses:
        "200":
          description: Calendar provider test completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarProviderTestResponse"
components:
  schemas:
    Appointment:
      type: object
      properties:
        id:
          type: string
          example: "12345"
        tenantKey:
          type: string
          example: citycare-hospital
        patientId:
          type: string
          example: "67890"
        clinicianId:
          type: string
          example: "54321"
        appointmentDate:
          type: string
          format: date-time
          example: "2023-10-01T10:00:00Z"
        status:
          type: string
          enum: [scheduled, completed, cancelled, pending-triage]
          example: "scheduled"
        source:
          type: string
          example: standard
        opdEntryId:
          type: string
          nullable: true
          example: opd-1001
        createdByRole:
          type: string
          example: frontdesk
        updatedByRole:
          type: string
          nullable: true
          example: operations
    AppointmentCreateRequest:
      type: object
      required:
        - actorRole
        - patientId
        - appointmentDate
      properties:
        actorRole:
          type: string
          enum: [admin, frontdesk, doctor, nurse, operations, patient]
          example: frontdesk
        tenantKey:
          type: string
          example: citycare-hospital
        patientId:
          type: string
          example: pat-88
        clinicianId:
          type: string
          example: cln-42
        appointmentDate:
          type: string
          format: date-time
          example: "2026-04-02T09:00:00Z"
        status:
          type: string
          enum: [scheduled, completed, cancelled, pending-triage]
          example: scheduled
        source:
          type: string
          example: opd
        opdEntryId:
          type: string
          example: opd-1001
    AppointmentUpdateRequest:
      type: object
      required:
        - actorRole
      properties:
        actorRole:
          type: string
          enum: [admin, frontdesk, doctor, nurse, operations]
          example: operations
        patientId:
          type: string
          example: pat-88
        clinicianId:
          type: string
          example: cln-42
        appointmentDate:
          type: string
          format: date-time
          example: "2026-04-02T09:30:00Z"
        status:
          type: string
          enum: [scheduled, completed, cancelled, pending-triage]
          example: scheduled
        source:
          type: string
          example: opd
        opdEntryId:
          type: string
          nullable: true
          example: opd-1001
    OpdEntry:
      type: object
      properties:
        id:
          type: string
          example: opd-1001
        tenantKey:
          type: string
          example: citycare-hospital
        patientId:
          type: string
          example: pat-88
        visitReason:
          type: string
          example: recurrent migraine
        triageLevel:
          type: string
          enum: [low, medium, high, critical]
          example: high
        visitType:
          type: string
          enum: [walk-in, follow-up, referred]
          example: walk-in
        requestedDateTime:
          type: string
          format: date-time
          example: "2026-04-02T09:00:00Z"
        status:
          type: string
          example: intake-recorded
        notes:
          type: string
          example: requires urgent clinician review
        createdAt:
          type: string
          format: date-time
        createdByRole:
          type: string
          example: frontdesk
    OpdEntryCreateRequest:
      type: object
      required:
        - actorRole
        - patientId
        - visitReason
        - requestedDateTime
      properties:
        actorRole:
          type: string
          enum: [admin, frontdesk, doctor, nurse]
          example: frontdesk
        tenantKey:
          type: string
          example: citycare-hospital
        patientId:
          type: string
          example: pat-88
        clinicianId:
          type: string
          example: cln-42
        visitReason:
          type: string
          example: recurrent migraine
        triageLevel:
          type: string
          enum: [low, medium, high, critical]
          example: high
        visitType:
          type: string
          enum: [walk-in, follow-up, referred]
          example: walk-in
        requestedDateTime:
          type: string
          format: date-time
          example: "2026-04-02T09:00:00Z"
        notes:
          type: string
          example: requires urgent clinician review
        createAppointment:
          type: boolean
          example: true
    OpdEntryCreateResponse:
      type: object
      properties:
        opdEntry:
          $ref: "#/components/schemas/OpdEntry"
        appointmentDraft:
          nullable: true
          $ref: "#/components/schemas/Appointment"
    OpdEntriesListResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/OpdEntry"
        total:
          type: integer
          example: 2
        returned:
          type: integer
          example: 2
        limit:
          type: integer
          example: 50
    AppointmentRoleErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: Appointment entry blocked for role
        code:
          type: string
          example: APPOINTMENT_ENTRY_ROLE_BLOCKED
        details:
          type: object
          properties:
            role:
              type: string
              example: patient
            action:
              type: string
              example: appointment.update
            allowedRoles:
              type: array
              items:
                type: string
              example:
                - admin
                - frontdesk
                - doctor
    ValidationErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: appointmentDate must be a valid ISO date-time
        code:
          type: string
          example: APPOINTMENT_PAYLOAD_INVALID
    CalendarProviderStatus:
      type: object
      properties:
        key:
          type: string
          example: google-calendar
        displayName:
          type: string
          example: Google Calendar
        enabled:
          type: boolean
          example: true
        billing:
          type: object
          properties:
            model:
              type: string
              enum:
                - free
                - paid
              example: free
            adminActionRequired:
              type: boolean
              example: true
            setupUrl:
              type: string
              example: https://developers.google.com/calendar
            notes:
              type: string
              example: Admin completes provider account onboarding directly.
    CalendarProviderTestRequest:
      type: object
      required:
        - tenantKey
        - providerKey
        - appointmentId
        - clinicianId
        - patientId
        - startTime
        - endTime
      properties:
        tenantKey:
          type: string
          example: citycare-hospital
        providerKey:
          type: string
          enum:
            - google-calendar
            - apple-calendar
            - outlook-calendar
            - ics-calendar
            - internal-calendar
        appointmentId:
          type: string
          example: apt-1001
        clinicianId:
          type: string
          example: cln-42
        patientId:
          type: string
          example: pat-88
        startTime:
          type: string
          format: date-time
          example: "2026-04-02T09:00:00Z"
        endTime:
          type: string
          format: date-time
          example: "2026-04-02T09:30:00Z"
    CalendarProviderTestResponse:
      type: object
      properties:
        provider:
          type: string
          example: google-calendar
        accepted:
          type: boolean
          example: true
        externalEventId:
          type: string
          example: google-apt-1001
        detail:
          type: string
          example: Booking accepted by provider adapter.
