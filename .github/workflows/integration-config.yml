name: Integration Config Validation

on:
  push:
    branches:
      - main
    paths:
      - config/integrations/**
      - contracts/rest/integration-provider-config.schema.json
      - scripts/validate-integration-config.mjs
  pull_request:
    branches:
      - main
    paths:
      - config/integrations/**
      - contracts/rest/integration-provider-config.schema.json
      - scripts/validate-integration-config.mjs
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate-integration-config:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Enable Corepack and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate integration configuration
        run: node ./scripts/validate-integration-config.mjs
