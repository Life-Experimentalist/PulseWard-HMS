openapi: 3.0.0
info:
  title: PulseWard Authentication Service
  description: API for role-based authentication, OAuth provider setup, and tenant domain resolution.
  version: 1.2.0
servers:
  - url: http://localhost:8081/api/v1
    description: Development server
paths:
  /auth/roles:
    get:
      summary: List supported role keys
      tags:
        - Auth
      responses:
        "200":
          description: Supported role keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles:
                    type: array
                    items:
                      type: string

  /auth/session/events:
    get:
      summary: List recent auth session observability events
      tags:
        - Auth
      parameters:
        - name: tenantKey
          in: query
          required: false
          schema:
            type: string
        - name: role
          in: query
          required: false
          schema:
            type: string
        - name: action
          in: query
          required: false
          schema:
            type: string
        - name: outcome
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Filtered auth session events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionEventsResponse"

  /auth/workflow-entry/check:
    post:
      summary: Check whether role/provider can enter patient or clinical workflow
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowEntryCheckRequest"
      responses:
        "200":
          description: Workflow entry allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowEntryAllowedResponse"
        "400":
          description: Invalid workflow check payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowEntryPayloadErrorResponse"
        "401":
          description: MFA is required before workflow entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowEntryMfaRequiredResponse"
        "403":
          description: Workflow entry denied by policy or role compatibility
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthPolicyDeniedResponse"
                  - $ref: "#/components/schemas/WorkflowEntryRoleDeniedResponse"

  /auth/otp/request:
    post:
      summary: Create tenant-scoped OTP challenge for role login flow
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "200":
          description: OTP challenge issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpChallengeResponse"
        "400":
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: OTP flow blocked by tenant auth policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthPolicyDeniedResponse"

  /auth/otp/verify:
    post:
      summary: Verify OTP challenge and issue short-lived OTP verified token
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyRequest"
      responses:
        "200":
          description: OTP verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpVerifyResponse"
        "400":
          description: Invalid, expired, or missing OTP challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpVerifyErrorResponse"

  /auth/register:
    post:
      summary: Register a user for a tenant and role
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      summary: Login and receive JWT token
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Successful login
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Login blocked by tenant auth policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthPolicyDeniedResponse"
        "401":
          description: MFA required by tenant policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaRequiredResponse"

  /auth/oauth/providers:
    get:
      summary: List OAuth providers and enablement state
      tags:
        - OAuth
      parameters:
        - name: tenantKey
          in: query
          required: false
          schema:
            type: string
            default: default
      responses:
        "200":
          description: Provider catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthProvidersResponse"

  /auth/oauth/google/start:
    get:
      summary: Build Google OAuth URL for tenant and role
      tags:
        - OAuth
      parameters:
        - name: tenantKey
          in: query
          required: false
          schema:
            type: string
            default: default
        - name: role
          in: query
          required: false
          schema:
            type: string
            default: patient
      responses:
        "200":
          description: Google OAuth bootstrap payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleOAuthStartResponse"
        "403":
          description: Google OAuth flow blocked by tenant auth policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthPolicyDeniedResponse"

  /auth/oauth/google/callback:
    post:
      summary: Exchange OAuth callback payload for a platform JWT
      tags:
        - OAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleOAuthCallbackRequest"
      responses:
        "200":
          description: OAuth login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleOAuthCallbackResponse"
        "403":
          description: Google OAuth callback blocked by tenant auth policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthPolicyDeniedResponse"

  /auth/oauth/clerk/start:
    get:
      summary: Get Clerk setup metadata for tenant login
      tags:
        - OAuth
      parameters:
        - name: tenantKey
          in: query
          required: false
          schema:
            type: string
            default: default
        - name: role
          in: query
          required: false
          schema:
            type: string
            default: patient
      responses:
        "200":
          description: Clerk bootstrap metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClerkStartResponse"
        "403":
          description: Clerk flow blocked by tenant auth policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthPolicyDeniedResponse"

  /auth/oauth/google/config-status:
    get:
      summary: Get Google OAuth environment configuration readiness
      tags:
        - OAuth
      responses:
        "200":
          description: Google OAuth configuration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleOAuthConfigStatusResponse"

  /platform/abha/config-status:
    get:
      summary: Get ABHA integration environment readiness
      tags:
        - Platform Domains
      responses:
        "200":
          description: ABHA configuration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbhaConfigStatusResponse"

  /platform/abha/health-check:
    get:
      summary: Check ABHA gateway reachability
      tags:
        - Platform Domains
      parameters:
        - name: timeoutMs
          in: query
          required: false
          schema:
            type: integer
            default: 4000
      responses:
        "200":
          description: ABHA gateway check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbhaHealthCheckResponse"
        "400":
          description: ABHA gateway configuration missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbhaHealthCheckResponse"
        "502":
          description: ABHA gateway check failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbhaHealthCheckResponse"

  /platform/abha/health-check/evidence:
    get:
      summary: Retrieve ABHA gateway health-check evidence for incident drills
      tags:
        - Platform Domains
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: outcome
          in: query
          required: false
          schema:
            type: string
            enum:
              - all
              - reachable
              - unreachable
            default: all
      responses:
        "200":
          description: ABHA health-check evidence feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbhaHealthCheckEvidenceResponse"

  /platform/abha/consent-flow/simulation:
    get:
      summary: Simulate ABHA consent workflow checkpoints for operational drills
      tags:
        - Platform Domains
      parameters:
        - name: tenantKey
          in: query
          required: false
          schema:
            type: string
            default: default
        - name: scenario
          in: query
          required: false
          schema:
            type: string
            enum:
              - happy-path
              - consent-denied
              - gateway-timeout
            default: happy-path
      responses:
        "200":
          description: ABHA consent simulation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbhaConsentFlowSimulationResponse"

  /platform/abha/fallback-decision/telemetry:
    get:
      summary: Return ABHA fallback decision telemetry for operational drills
      tags:
        - Platform Domains
      parameters:
        - name: tenantKey
          in: query
          required: false
          schema:
            type: string
            default: default
        - name: scenario
          in: query
          required: false
          schema:
            type: string
            enum:
              - health-check-derived
              - gateway-timeout
              - consent-denied
              - happy-path
            default: health-check-derived
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: ABHA fallback decision telemetry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbhaFallbackDecisionTelemetryResponse"

  /platform/abha/operational-readiness:
    get:
      summary: Get ABHA operational readiness checklist and diagnostics summary
      tags:
        - Platform Domains
      responses:
        "200":
          description: ABHA operational readiness summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbhaOperationalReadinessResponse"

  /admin/settings/storage:
    get:
      summary: Get admin settings storage metadata
      tags:
        - Admin Settings
      responses:
        "200":
          description: Settings storage details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettingsStorageResponse"

  /admin/settings:
    get:
      summary: Get admin dashboard settings for a tenant
      tags:
        - Admin Settings
      parameters:
        - name: tenantKey
          in: query
          required: false
          schema:
            type: string
            default: default
      responses:
        "200":
          description: Tenant settings payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettingsResponse"
    put:
      summary: Save admin dashboard settings for a tenant
      tags:
        - Admin Settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSettingsUpdateRequest"
      responses:
        "200":
          description: Settings persisted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettingsResponse"
        "400":
          description: Invalid admin settings payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthPolicyValidationResponse"

  /admin/settings/auth-policy/validate:
    post:
      summary: Validate tenant auth policy payload without persisting
      tags:
        - Admin Settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAuthPolicyValidationRequest"
      responses:
        "200":
          description: Auth policy payload is valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthPolicyValidationResponse"
        "400":
          description: Auth policy payload is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthPolicyValidationResponse"

  /platform/domain-config:
    get:
      summary: Resolve platform and tenant domain config
      tags:
        - Platform Domains
      parameters:
        - name: tenantKey
          in: query
          required: false
          schema:
            type: string
            default: default
      responses:
        "200":
          description: Resolved domain config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedDomainConfig"

  /platform/domain-config/validate:
    post:
      summary: Validate a browser origin for a tenant
      tags:
        - Platform Domains
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DomainValidationRequest"
      responses:
        "200":
          description: Domain validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainValidationResponse"
        "400":
          description: Missing tenantKey or origin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /platform/domain-config/all:
    get:
      summary: Get full domain configuration model
      tags:
        - Platform Domains
      responses:
        "200":
          description: Full domain configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainConfig"

components:
  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - role
      properties:
        email:
          type: string
          format: email
          example: admin@citycare.example.com
        password:
          type: string
          example: secure-password
        role:
          type: string
          example: admin
        tenantKey:
          type: string
          example: citycare-hospital
    OtpRequest:
      type: object
      required:
        - tenantKey
        - role
      properties:
        tenantKey:
          type: string
          example: citycare-hospital
        role:
          type: string
          example: doctor
        recipient:
          type: string
          example: doctor@citycare.example.com
    OtpChallengeResponse:
      type: object
      properties:
        challengeId:
          type: string
          example: 9f1fbf9a-1497-4c7f-a8df-43d0863218ba
        tenantKey:
          type: string
          example: citycare-hospital
        role:
          type: string
          example: doctor
        deliveryChannel:
          type: string
          enum:
            - email
            - phone
            - both
          example: email
        expiresInSeconds:
          type: integer
          example: 300
        detail:
          type: string
          example: OTP challenge generated
        demoCode:
          type: string
          nullable: true
          example: "123456"
    OtpVerifyRequest:
      type: object
      required:
        - challengeId
        - code
      properties:
        challengeId:
          type: string
          example: 9f1fbf9a-1497-4c7f-a8df-43d0863218ba
        code:
          type: string
          example: "123456"
    OtpVerifyResponse:
      type: object
      properties:
        verified:
          type: boolean
          example: true
        tenantKey:
          type: string
          example: citycare-hospital
        role:
          type: string
          example: doctor
        otpVerifiedToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        expiresInMinutes:
          type: integer
          example: 10
    OtpVerifyErrorResponse:
      type: object
      properties:
        verified:
          type: boolean
          example: false
        code:
          type: string
          example: OTP_CODE_INVALID
        message:
          type: string
          example: Invalid OTP code
    RegisterResponse:
      type: object
      properties:
        userId:
          type: string
          example: 6d6df4ee-c329-437f-a88b-1d4a2082f9f9
        message:
          type: string
          example: User registered
    LoginRequest:
      type: object
      required:
        - email
        - password
        - role
      properties:
        email:
          type: string
          format: email
          example: admin@citycare.example.com
        password:
          type: string
          example: secure-password
        role:
          type: string
          example: admin
        tenantKey:
          type: string
          example: citycare-hospital
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        provider:
          type: string
          example: email-password
        role:
          type: string
          example: admin
        tenantKey:
          type: string
          example: citycare-hospital
        session:
          $ref: "#/components/schemas/AuthSessionMetadata"
    OAuthProvidersResponse:
      type: object
      properties:
        tenantKey:
          type: string
          example: citycare-hospital
        authPolicy:
          $ref: "#/components/schemas/AdminAuthPolicy"
        providers:
          type: array
          items:
            $ref: "#/components/schemas/OAuthProviderStatus"
    OAuthProviderStatus:
      type: object
      properties:
        key:
          type: string
          example: google-oauth
        envEnabled:
          type: boolean
          example: true
        policyEnabled:
          type: boolean
          example: true
        enabled:
          type: boolean
          example: true
        mode:
          type: string
          enum:
            - free
            - paid-optional
          example: free
    GoogleOAuthStartResponse:
      type: object
      properties:
        provider:
          type: string
          example: google-oauth
        oauthUrl:
          type: string
          example: https://accounts.google.com/o/oauth2/v2/auth?client_id=...
        note:
          type: string
          example: Admin must configure Google OAuth client in console.
    GoogleOAuthCallbackRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: doctor@citycare.example.com
        role:
          type: string
          example: doctor
        tenantKey:
          type: string
          example: citycare-hospital
    GoogleOAuthCallbackResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        provider:
          type: string
          example: google-oauth
        role:
          type: string
          example: doctor
        tenantKey:
          type: string
          example: citycare-hospital
        session:
          $ref: "#/components/schemas/AuthSessionMetadata"
    AuthSessionMetadata:
      type: object
      properties:
        expiresInMinutes:
          type: integer
          example: 60
    AuthSessionEvent:
      type: object
      properties:
        eventId:
          type: string
          example: b6c307cc-6bb7-4d4c-bff4-af50de93f615
        eventType:
          type: string
          example: auth.workflow.entry.allowed
        occurredAt:
          type: string
          format: date-time
        tenantKey:
          type: string
          example: citycare-hospital
        role:
          type: string
          example: doctor
        provider:
          type: string
          nullable: true
          example: email-password
        action:
          type: string
          nullable: true
          example: auth.workflow.entry.check
        outcome:
          type: string
          example: allowed
        code:
          type: string
          nullable: true
          example: AUTH_WORKFLOW_ROLE_BLOCKED
        details:
          type: object
          additionalProperties: true
    AuthSessionEventsResponse:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/AuthSessionEvent"
        total:
          type: integer
          example: 12
        returned:
          type: integer
          example: 10
        limit:
          type: integer
          example: 10
    WorkflowEntryCheckRequest:
      type: object
      required:
        - workflowKey
        - role
      properties:
        tenantKey:
          type: string
          example: citycare-hospital
        role:
          type: string
          example: doctor
        provider:
          type: string
          default: email-password
          example: email-password
        workflowKey:
          type: string
          enum:
            - patient.profile.view
            - patient.profile.update
            - clinical.ehr.write
            - clinical.prescription.write
            - clinical.lab.order
            - appointment.manage
          example: clinical.ehr.write
        otpVerifiedToken:
          type: string
          nullable: true
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    WorkflowEntryAllowedResponse:
      type: object
      properties:
        allowed:
          type: boolean
          example: true
        tenantKey:
          type: string
          example: citycare-hospital
        role:
          type: string
          example: doctor
        provider:
          type: string
          example: email-password
        workflowKey:
          type: string
          example: clinical.ehr.write
        session:
          $ref: "#/components/schemas/AuthSessionMetadata"
        audit:
          $ref: "#/components/schemas/AuthAuditMetadata"
    WorkflowEntryRoleDeniedResponse:
      type: object
      properties:
        allowed:
          type: boolean
          example: false
        code:
          type: string
          example: AUTH_WORKFLOW_ROLE_BLOCKED
        message:
          type: string
          example: Role is not allowed for workflow
        details:
          type: object
          properties:
            workflowKey:
              type: string
              example: clinical.prescription.write
            role:
              type: string
              example: nurse
            allowedRoles:
              type: array
              items:
                type: string
              example:
                - admin
                - doctor
        audit:
          $ref: "#/components/schemas/AuthAuditMetadata"
    WorkflowEntryMfaRequiredResponse:
      type: object
      properties:
        allowed:
          type: boolean
          example: false
        message:
          type: string
          example: MFA required for this tenant policy
        code:
          type: string
          example: MFA_REQUIRED
        details:
          type: object
          properties:
            tenantKey:
              type: string
              example: citycare-hospital
            role:
              type: string
              example: doctor
            workflowKey:
              type: string
              example: clinical.ehr.write
            requiredProvider:
              type: string
              example: otp
            hint:
              type: string
              example: Complete /auth/otp/request and /auth/otp/verify before workflow entry
        audit:
          $ref: "#/components/schemas/AuthAuditMetadata"
    WorkflowEntryPayloadErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: workflowKey and role are required
        code:
          type: string
          example: WORKFLOW_CHECK_PAYLOAD_INVALID
    AuthAuditMetadata:
      type: object
      properties:
        eventType:
          type: string
          example: auth.workflow.entry.allowed
        eventId:
          type: string
          example: b6c307cc-6bb7-4d4c-bff4-af50de93f615
        occurredAt:
          type: string
          format: date-time
    MfaRequiredResponse:
      type: object
      properties:
        message:
          type: string
          example: MFA required for this tenant policy
        code:
          type: string
          example: MFA_REQUIRED
        details:
          type: object
          properties:
            tenantKey:
              type: string
              example: citycare-hospital
            role:
              type: string
              example: doctor
            requiredProvider:
              type: string
              example: otp
            hint:
              type: string
              example: Complete /auth/otp/request and /auth/otp/verify before login
    AuthPolicyDeniedResponse:
      type: object
      properties:
        message:
          type: string
          example: Auth flow blocked by tenant policy
        code:
          type: string
          example: AUTH_POLICY_PROVIDER_BLOCKED
        details:
          type: object
          properties:
            tenantKey:
              type: string
              example: citycare-hospital
            provider:
              type: string
