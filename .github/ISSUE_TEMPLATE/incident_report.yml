name: Incident report
description: Report an outage or reliability incident.
title: "[Incident]: "
labels:
  - incident
  - triage
  - operations
body:
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - SEV-1 (critical)
        - SEV-2 (high)
        - SEV-3 (medium)
        - SEV-4 (low)
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Incident summary
      description: What happened and who is impacted?
    validations:
      required: true
  - type: textarea
    id: timeline
    attributes:
      label: Timeline
      description: Detection time, mitigation time, and current status.
      placeholder: |
        - Detected:
        - Mitigation started:
        - Current status:
    validations:
      required: true
  - type: textarea
    id: blast_radius
    attributes:
      label: Blast radius
      description: Affected hospitals, modules, and user roles.
  - type: textarea
    id: recovery
    attributes:
      label: Recovery and rollback
      description: Steps taken and rollback path used.
    validations:
      required: true
  - type: textarea
    id: postmortem
    attributes:
      label: Follow-up actions
      description: Preventive actions and owners.
