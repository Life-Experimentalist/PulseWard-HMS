openapi: 3.0.0
info:
  title: PulseWard Billing Service API
  description: API for billing records and clinical trigger hook processing.
  version: 1.2.0
servers:
  - url: http://localhost:5108
    description: Development server
paths:
  /billing:
    get:
      summary: List billing records
      parameters:
        - name: tenantKey
          in: query
          required: false
          schema:
            type: string
        - name: patientId
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, pending-verification, ready-for-invoice, paid, cancelled]
      responses:
        "200":
          description: Billing records returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingRecordListResponse"
    post:
      summary: Create manual billing record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingCreateRequest"
      responses:
        "201":
          description: Billing record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingRecord"
        "400":
          description: Invalid billing payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingErrorResponse"
  /billing/{id}:
    get:
      summary: Get billing record by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Billing record found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingRecord"
        "400":
          description: Invalid id format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingErrorResponse"
        "404":
          description: Billing record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingErrorResponse"
    put:
      summary: Update billing record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingUpdateRequest"
      responses:
        "200":
          description: Billing record updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingRecord"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingErrorResponse"
        "404":
          description: Billing record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingErrorResponse"
    delete:
      summary: Delete billing record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Billing record deleted
        "400":
          description: Invalid id format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingErrorResponse"
        "404":
          description: Billing record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingErrorResponse"
  /billing/hooks/clinical-trigger:
    get:
      summary: List processed clinical trigger receipts
      parameters:
        - name: tenantKey
          in: query
          required: false
          schema:
            type: string
        - name: patientId
          in: query
          required: false
          schema:
            type: string
        - name: triggerType
          in: query
          required: false
          schema:
            type: string
            enum:
              - clinical.lab.result.reported
              - clinical.prescription.handed-off
              - clinical.prescription.fulfilled
      responses:
        "200":
          description: Receipt list returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingTriggerReceiptListResponse"
    post:
      summary: Consume and process a clinical trigger hook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingClinicalTriggerRequest"
      responses:
        "201":
          description: Trigger processed and billing record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingTriggerProcessResponse"
        "400":
          description: Invalid trigger payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingErrorResponse"
        "403":
          description: Actor role not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingErrorResponse"
        "409":
          description: Duplicate correlation id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingErrorResponse"
  /billing/hooks/clinical-trigger/{id}:
    get:
      summary: Get processed clinical trigger receipt by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Receipt found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingTriggerReceipt"
        "404":
          description: Receipt not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingErrorResponse"
components:
  schemas:
    BillingRecord:
      type: object
      properties:
        id:
          type: integer
          example: 101
        tenantKey:
          type: string
          example: citycare-hospital
        patientId:
          type: string
          example: pat-1001
        amount:
          type: number
          format: float
          example: 50.0
        currency:
          type: string
          example: INR
        status:
          type: string
          enum: [draft, pending-verification, ready-for-invoice, paid, cancelled]
          example: ready-for-invoice
        source:
          $ref: "#/components/schemas/BillingSourceContext"
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    BillingSourceContext:
      type: object
      properties:
        triggerType:
          type: string
          example: clinical.lab.result.reported
        sourceService:
          type: string
          example: lab-service
        sourceReferenceId:
          type: string
          example: ord-lab-1001
        correlationId:
          type: string
          example: corr-lab-1001
    BillingCreateRequest:
      type: object
      required:
        - patientId
        - amount
        - status
      properties:
        tenantKey:
          type: string
          example: citycare-hospital
        patientId:
          type: string
          example: pat-1001
        amount:
          type: number
          format: float
          example: 125.0
        currency:
          type: string
          example: INR
        status:
          type: string
          enum: [draft, pending-verification, ready-for-invoice, paid, cancelled]
          example: draft
        sourceReferenceId:
          type: string
          example: manual-1001
        correlationId:
          type: string
          example: corr-manual-1001
        source:
          $ref: "#/components/schemas/BillingSourceContext"
    BillingUpdateRequest:
      type: object
      properties:
        amount:
          type: number
          format: float
          example: 130.0
        status:
          type: string
          enum: [draft, pending-verification, ready-for-invoice, paid, cancelled]
          example: paid
    BillingRecordListResponse:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/BillingRecord"
        total:
          type: integer
          example: 1
    BillingClinicalTriggerRequest:
      type: object
      required:
        - actorRole
        - tenantKey
        - patientId
        - triggerType
        - sourceService
        - sourceReferenceId
        - correlationId
      properties:
        actorRole:
          type: string
          enum: [admin, operations, system, billing]
          example: operations
        tenantKey:
          type: string
          example: citycare-hospital
        patientId:
          type: string
          example: pat-1001
        triggerType:
          type: string
          enum:
            - clinical.lab.result.reported
            - clinical.prescription.handed-off
            - clinical.prescription.fulfilled
        sourceService:
          type: string
          enum: [lab-service, ehr-service, pharmacy-service]
          example: lab-service
        sourceReferenceId:
          type: string
          example: ord-lab-1001
        correlationId:
          type: string
          example: corr-lab-1001
        amount:
          type: number
          format: float
          example: 50.0
        currency:
          type: string
          example: INR
        metadata:
          type: object
          additionalProperties: true
    BillingTriggerReceipt:
      type: object
      properties:
        id:
          type: string
          example: f1c95d8f-2f50-4bfd-b66e-0f60bdb5228d
        actorRole:
          type: string
          example: operations
        tenantKey:
          type: string
          example: citycare-hospital
        patientId:
          type: string
          example: pat-1001
        triggerType:
          type: string
          example: clinical.lab.result.reported
        sourceService:
          type: string
          example: lab-service
        sourceReferenceId:
          type: string
          example: ord-lab-1001
        correlationId:
          type: string
          example: corr-lab-1001
        billingRecordId:
          type: integer
          example: 101
        processingStatus:
          type: string
          example: processed
        processedAt:
          type: string
          format: date-time
    BillingTriggerReceiptListResponse:
      type: object
      properties:
        receipts:
          type: array
          items:
            $ref: "#/components/schemas/BillingTriggerReceipt"
        total:
          type: integer
          example: 1
    BillingTriggerProcessResponse:
      type: object
      properties:
        receipt:
          $ref: "#/components/schemas/BillingTriggerReceipt"
        billingRecord:
          $ref: "#/components/schemas/BillingRecord"
    BillingErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: clinical trigger payload is invalid
        code:
          type: string
          example: BILLING_TRIGGER_PAYLOAD_INVALID
        details:
          type: object
          additionalProperties: true
