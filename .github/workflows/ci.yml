name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Enable Corepack and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check contract compatibility (M1)
        run: pnpm run contracts:check -- --strict

      - name: Run tests
        run: pnpm test

      - name: Build applications
        run: pnpm run build:apps:ci

      - name: Lint code
        run: pnpm run lint

      - name: Publish artifacts
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p artifacts
          cp -r apps/* artifacts/
          cp -r services/* artifacts/
          echo "Artifacts published."
