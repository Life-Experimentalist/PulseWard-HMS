  /v1/makeBundle:
    post:
      summary: DS2 - Make Bundle
      operationId: post-v1-makeBundle
      responses:
        "202":
          description: Accepted
      tags:
        - Inter service
      description: >-
        Call from DS1 to DS2 to create FHIR bundles for sharing with HIUs. This
        is called once for every data request from HIU
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dataRequestDocumentId:
                  type: string
                  format: uuid
                  description: >-
                    Will be the same as consentId since it is used as the index
                    in mongodb
            examples:
              Example 1:
                value:
                  dataRequestDocumentId: e6fb367d-7119-4735-8323-52cf65304fea
    parameters: []
  /v1/sendBundle:
    post:
      summary: DS3 - Encrypt & send bundle
      operationId: post-v1-sendBundle
      responses:
        "202":
          description: Accepted
      description: >-
        Call from DS2 to DS2 to createencrypt the FHIR bundle and share with
        HIU. This is called for ewvery hiType to be sent
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dataRequestId:
                  type: string
                  format: uuid
                  description: >-
                    Will be the same as consentId since it is used as the index
                    in mongodb
                bundleId:
                  type: string
                  description: Id of the bundle to be encrypted & sent
                  format: uuid
                careContextId:
                  type: string
                  format: uuid
                  description: "Id of the careContext of the bundle content "
                noOfItems:
                  type: integer
                  description: Number of items still pending in the request
                hipId:
                  type: string
                  x-stoplight:
                    id: aa9anf6krk9su
              required:
                - dataRequestId
                - noOfItems
            examples:
              Example 1:
                value:
                  dataRequestId: fcad97ea-5a54-409b-b1a8-235e00a156e2
                  bundleId: b7ec5420-07d5-4432-b1d4-988b3c8d3901
                  careContextId: 88689e12-5124-4394-a490-ab279f7cc1b2
                  noOfItems: 0
        description: ""
      tags:
        - Inter service
  /v1/processBundle:
    post:
      summary: DS4 - Process the received bundle
      operationId: post-v1-processBundle
      responses:
        "202":
          description: Accepted
        "400":
          description: Bad Request
      description: >-
        Call from DS3 to DS4 to fetch the received bundle from mongoDB and
        process so that it can be retrieved when health system requests. Used in
        the M3 HIU when health information is received from remote HIPs
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                transactionId:
                  type: string
                internalDocumentId:
                  type: string
                careContextReference:
                  type: string
              x-examples:
                Example 1:
                  transactionId: 8823f968-32b0-4741-924c-9bcf44822326
                  internalDocumentId: 1959fbce-e4a8-4798-a597-95aebfb75ffb
                  careContextReference: bba0a2d7-d145-4925-afb1-bfdca751c8d2
            examples:
              Example 1:
                value:
                  transactionId: string
                  internalDocumentId: string
                  careContextReference: string
        description: ""
      tags:
        - Inter service
      parameters:
        - $ref: "#/components/parameters/X-HIU-ID"
    parameters: []
  /ehrn/abdmc/v3/{tenant}/patients/find:
    post:
      summary: HIU - Identify a patient from ABDM with ABHA
      description: >-
        Confirm the identity of a patient from ABDM using their healthId(ABHA
        address)
