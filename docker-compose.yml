# PulseWard HMS — Docker Compose
# Production stack: api-gateway + 4 static frontend apps behind nginx
#
# Usage:
#   docker compose up -d          # start all services
#   docker compose logs -f        # tail logs
#   docker compose down -v        # stop and remove volumes
#
# Before first run:
#   cp .env.example .env          # fill in JWT_SECRET, CORS_ALLOWED_ORIGINS etc.

services:
  # ─── API GATEWAY (Hono + SQLite) ─────────────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: pulseward-api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      API_PORT: "8787"
      DB_PATH: /data/pulseward.db
    volumes:
      - pulseward-data:/data
    networks:
      - pulseward-internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8787/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ─── FRONTEND BUILDER (builds all 4 Vite apps) ───────────────────────────────
  frontend-builder:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    command: >
      sh -c "corepack enable &&
             corepack prepare pnpm@9.15.0 --activate &&
             pnpm install --frozen-lockfile &&
             pnpm run build:apps"
    profiles:
      - build

  # ─── NGINX (reverse proxy + static file server) ──────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: pulseward-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./apps/patient-portal/dist:/srv/patient:ro
      - ./apps/clinician-portal/dist:/srv/clinician:ro
      - ./apps/admin-console/dist:/srv/admin:ro
      - ./apps/operations-dashboard/dist:/srv/ops:ro
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - pulseward-internal
      - pulseward-public

networks:
  pulseward-internal:
    driver: bridge
  pulseward-public:
    driver: bridge

volumes:
  pulseward-data:
    driver: local
