# PulseWard HMS — Nginx Configuration
# Serves 4 frontend SPAs + proxies /api to the api-gateway.
#
# Domain layout (edit server_name to match your domains):
#   portal.yourhospital.com   → Patient Portal
#   clinician.yourhospital.com → Clinician Portal
#   admin.yourhospital.com    → Admin Console
#   ops.yourhospital.com      → Operations Dashboard
#
# For a single-domain setup, use path-based routing below.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ─── Rate limiting ───────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    # ─── Upstream ────────────────────────────────────────────────────────────────
    upstream api_gateway {
        server api-gateway:8787;
        keepalive 32;
    }

    # ─── HTTP → HTTPS redirect ───────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ─── Patient Portal ──────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name portal.yourhospital.com;

        ssl_certificate     /etc/nginx/ssl/yourhospital.crt;
        ssl_certificate_key /etc/nginx/ssl/yourhospital.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        root /srv/patient;
        index index.html;

        # API proxy
        location /api/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Auth rate-limit
        location /api/v1/auth/login {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SPA fallback — all unknown paths serve index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ─── Clinician Portal ────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name clinician.yourhospital.com;

        ssl_certificate     /etc/nginx/ssl/yourhospital.crt;
        ssl_certificate_key /etc/nginx/ssl/yourhospital.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        root /srv/clinician;
        index index.html;

        location /api/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location / { try_files $uri $uri/ /index.html; }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ─── Admin Console ───────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name admin.yourhospital.com;

        ssl_certificate     /etc/nginx/ssl/yourhospital.crt;
        ssl_certificate_key /etc/nginx/ssl/yourhospital.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Restrict access to known admin IPs in production
        # allow 10.0.0.0/8;
        # deny all;

        root /srv/admin;
        index index.html;

        location /api/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / { try_files $uri $uri/ /index.html; }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ─── Operations Dashboard ────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name ops.yourhospital.com;

        ssl_certificate     /etc/nginx/ssl/yourhospital.crt;
        ssl_certificate_key /etc/nginx/ssl/yourhospital.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        root /srv/ops;
        index index.html;

        location /api/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / { try_files $uri $uri/ /index.html; }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
