      operationId: get-v3-ehrn-abdmc-patients-profile-shared_profiles
      description: >-
        Healthcare systems use this API to get profiles received by ABDMc when
        the user scans the QRCode of the facility and approves the sharing of
        their profile. 


        The profiles that are received via the profile/share api are cached by
        ABDMc and made available via this API. These profiles are deleted by
        ABDMc 30 minuted after receipt.


        ## App developer notes

        Applications can use the tokenNumber received by the patients in their
        PHR app to get their shared profile. If this is not provided, ABMDc will
        return all cached profiles so that the user can select the appropriate
        one fronm the list. 


        Since the list of profiles may be large, the results are paginated(10
        per page) for better performance.

      parameters:
        - schema:
            type: string
          in: query
          name: tokenNumber
          description: Token received on the PHR app when profile is shared
        - schema:
            type: number
            example: 0
            default: 0
          in: query
          name: pageNumber
          description: "Page number to return. Starts with 0. "
          required: true
      tags:
        - Shared profile-V3
    parameters:
      - $ref: "#/components/parameters/tenant"
