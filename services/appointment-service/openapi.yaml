openapi: 3.0.0
info:
  title: Appointment Service API
  description: API for appointment lifecycle state management, OPD intake handoff, and calendar routing.
  version: 1.3.0
servers:
  - url: http://localhost:3000/api/v1
paths:
  /appointments:
    get:
      summary: Retrieve appointments with optional lifecycle filters
      parameters:
        - name: tenantKey
          in: query
          required: false
          schema:
            type: string
        - name: clinicianId
          in: query
          required: false
          schema:
            type: string
        - name: patientId
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - pending-triage
              - scheduled
              - checked-in
              - in-consultation
              - completed
              - cancelled
              - no-show
      responses:
        "200":
          description: Appointment list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Appointment"
    post:
      summary: Create appointment with idempotency and conflict handling
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentCreateRequest"
      responses:
        "200":
          description: Idempotent replay of existing appointment by clientRequestId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "201":
          description: Appointment created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "400":
          description: Invalid appointment payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "403":
          description: Appointment entry blocked for role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentRoleErrorResponse"
        "409":
          description: Appointment conflict with existing slot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentConflictErrorResponse"
  /appointments/{id}:
    get:
      summary: Retrieve a specific appointment by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Appointment details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "404":
          description: Appointment not found
    put:
      summary: Update appointment lifecycle state, schedule, or assigned clinician
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentUpdateRequest"
      responses:
        "200":
          description: Appointment updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "400":
          description: Invalid update payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "403":
          description: Appointment update blocked for role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentRoleErrorResponse"
        "404":
          description: Appointment not found
        "409":
          description: Version, transition, or slot conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentConflictErrorResponse"
    delete:
      summary: Cancel appointment via lifecycle transition
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Appointment cancelled successfully
        "400":
          description: Missing actor role for appointment cancel action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentRoleErrorResponse"
        "403":
          description: Appointment cancel blocked for role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentRoleErrorResponse"
        "404":
          description: Appointment not found
        "409":
          description: Invalid cancel transition for current status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentConflictErrorResponse"
  /opd/entries:
    get:
      summary: List OPD intake entries with optional filters
      parameters:
        - name: tenantKey
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: triageLevel
          in: query
          required: false
          schema:
            type: string
            enum: [low, medium, high, critical]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: OPD entry list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpdEntriesListResponse"
    post:
      summary: Create OPD intake entry and optional appointment draft handoff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpdEntryCreateRequest"
      responses:
        "201":
          description: OPD entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpdEntryCreateResponse"
        "400":
          description: Invalid OPD intake payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "403":
          description: OPD intake blocked for role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentRoleErrorResponse"
  /integrations/calendars/providers:
    get:
      summary: List calendar providers for a tenant
      parameters:
        - name: tenantKey
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Calendar providers for the tenant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarProviderStatus"
  /integrations/calendars/test:
    post:
      summary: Test calendar provider booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarProviderTestRequest"
      responses:
        "200":
          description: Calendar provider test completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarProviderTestResponse"
  /integrations/notifications/dispatch-events:
    get:
      summary: List appointment lifecycle notification dispatch attempts
      parameters:
        - name: tenantKey
          in: query
          required: false
          schema:
            type: string
        - name: appointmentId
          in: query
          required: false
          schema:
            type: string
        - name: eventType
          in: query
          required: false
          schema:
            type: string
            enum:
              - appointment.created
              - appointment.status-updated
              - appointment.rescheduled
              - appointment.cancelled
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - pending
              - delivered
              - failed
              - skipped
        - name: correlationId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Dispatch attempt events filtered by optional query fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDispatchEventsResponse"
  /integrations/notifications/dead-letter:
    get:
      summary: List notification dead-letter records for missed or delayed reminders
      parameters:
        - name: tenantKey
          in: query
          required: false
          schema:
            type: string
        - name: appointmentId
          in: query
          required: false
          schema:
            type: string
        - name: eventType
          in: query
          required: false
          schema:
            type: string
            enum:
              - appointment.created
              - appointment.status-updated
              - appointment.rescheduled
              - appointment.cancelled
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - pending
              - delivered
              - failed
              - skipped
        - name: correlationId
          in: query
          required: false
          schema:
            type: string
        - name: reason
          in: query
          required: false
          schema:
            type: string
            enum:
              - endpoint-not-configured
              - retry-exhausted
              - late-delivery
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Dead-letter events filtered by optional query fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDeadLetterEventsResponse"
  /integrations/notifications/dispatch-telemetry:
    get:
      summary: Get dispatch reliability telemetry counters for reminder delivery
      parameters:
        - name: tenantKey
          in: query
          required: false
          schema:
            type: string
        - name: eventType
          in: query
          required: false
          schema:
            type: string
            enum:
              - appointment.created
              - appointment.status-updated
              - appointment.rescheduled
              - appointment.cancelled
        - name: windowMinutes
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10080
            default: 1440
        - name: lateThresholdMs
          in: query
          required: false
          schema:
            type: integer
            minimum: 50
            maximum: 86400000
      responses:
        "200":
          description: Aggregated telemetry counters for dispatch reliability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDispatchTelemetryResponse"
components:
  schemas:
    Appointment:
      type: object
      properties:
        id:
          type: string
          example: apt-1001
        tenantKey:
          type: string
          example: citycare-hospital
        patientId:
          type: string
          example: pat-88
        clinicianId:
          type: string
          example: cln-42
        appointmentDate:
          type: string
          format: date-time
          example: "2026-04-02T09:00:00Z"
        durationMinutes:
          type: integer
          minimum: 5
          maximum: 240
          example: 30
        status:
          type: string
          enum:
            - pending-triage
            - scheduled
            - checked-in
            - in-consultation
            - completed
            - cancelled
            - no-show
          example: scheduled
        source:
          type: string
          example: opd
        opdEntryId:
          type: string
          nullable: true
          example: opd-1001
        createdByRole:
          type: string
          example: frontdesk
        updatedByRole:
          type: string
          nullable: true
          example: operations
        version:
          type: integer
          example: 2
        clientRequestId:
          type: string
          nullable: true
          example: req-appointment-1001
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        idempotentReplay:
          type: boolean
          example: true
        statusHistory:
          type: array
          items:
            $ref: "#/components/schemas/AppointmentStatusEvent"
    AppointmentStatusEvent:
      type: object
      properties:
        eventId:
          type: string
          example: evt-1001
        eventType:
          type: string
          example: appointment.status-updated
        actorRole:
          type: string
          example: operations
        fromStatus:
          type: string
          example: scheduled
        toStatus:
          type: string
          example: checked-in
        occurredAt:
          type: string
          format: date-time
        details:
          type: object
          additionalProperties: true
    AppointmentCreateRequest:
      type: object
      required:
        - actorRole
        - patientId
        - appointmentDate
      properties:
        actorRole:
          type: string
          enum: [admin, frontdesk, doctor, nurse, operations, patient]
          example: frontdesk
        tenantKey:
          type: string
          example: citycare-hospital
        patientId:
          type: string
          example: pat-88
        clinicianId:
          type: string
          example: cln-42
        appointmentDate:
          type: string
          format: date-time
          example: "2026-04-02T09:00:00Z"
        durationMinutes:
          type: integer
          minimum: 5
          maximum: 240
          example: 30
        status:
          type: string
          enum:
            - pending-triage
            - scheduled
            - checked-in
            - in-consultation
            - completed
            - cancelled
            - no-show
          example: scheduled
        source:
          type: string
          example: opd
        opdEntryId:
          type: string
          example: opd-1001
        clientRequestId:
          type: string
          example: req-appointment-1001
        correlationId:
          type: string
          example: corr-appointment-create-1001
    AppointmentUpdateRequest:
      type: object
      required:
        - actorRole
      properties:
        actorRole:
          type: string
          enum: [admin, frontdesk, doctor, nurse, operations]
          example: operations
        expectedVersion:
          type: integer
          example: 1
        patientId:
          type: string
          example: pat-88
        clinicianId:
          type: string
          example: cln-42
        appointmentDate:
          type: string
          format: date-time
          example: "2026-04-02T09:30:00Z"
        durationMinutes:
          type: integer
          minimum: 5
          maximum: 240
          example: 45
        status:
          type: string
          enum:
            - pending-triage
            - scheduled
            - checked-in
            - in-consultation
            - completed
            - cancelled
            - no-show
          example: checked-in
        source:
          type: string
          example: opd
        opdEntryId:
          type: string
          nullable: true
          example: opd-1001
        correlationId:
          type: string
          example: corr-appointment-update-1001
    OpdEntry:
      type: object
      properties:
        id:
          type: string
          example: opd-1001
        tenantKey:
          type: string
          example: citycare-hospital
        patientId:
          type: string
          example: pat-88
        visitReason:
          type: string
          example: recurrent migraine
        triageLevel:
          type: string
          enum: [low, medium, high, critical]
          example: high
        visitType:
          type: string
          enum: [walk-in, follow-up, referred]
          example: walk-in
        requestedDateTime:
          type: string
          format: date-time
          example: "2026-04-02T09:00:00Z"
        status:
          type: string
          example: intake-recorded
        notes:
          type: string
          example: requires urgent clinician review
        createdAt:
          type: string
          format: date-time
        createdByRole:
          type: string
          example: frontdesk
    OpdEntryCreateRequest:
      type: object
      required:
        - actorRole
        - patientId
        - visitReason
        - requestedDateTime
      properties:
        actorRole:
          type: string
          enum: [admin, frontdesk, doctor, nurse]
          example: frontdesk
        tenantKey:
          type: string
          example: citycare-hospital
        patientId:
          type: string
          example: pat-88
        clinicianId:
          type: string
          example: cln-42
        visitReason:
          type: string
          example: recurrent migraine
        triageLevel:
          type: string
          enum: [low, medium, high, critical]
          example: high
        visitType:
          type: string
          enum: [walk-in, follow-up, referred]
          example: walk-in
        requestedDateTime:
          type: string
          format: date-time
          example: "2026-04-02T09:00:00Z"
        notes:
          type: string
          example: requires urgent clinician review
        createAppointment:
          type: boolean
          example: true
        durationMinutes:
          type: integer
          minimum: 5
          maximum: 240
          example: 30
    OpdEntryCreateResponse:
      type: object
      properties:
        opdEntry:
          $ref: "#/components/schemas/OpdEntry"
        appointmentDraft:
          nullable: true
          $ref: "#/components/schemas/Appointment"
    OpdEntriesListResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/OpdEntry"
        total:
          type: integer
          example: 2
        returned:
          type: integer
          example: 2
        limit:
          type: integer
          example: 50
    AppointmentRoleErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: Appointment entry blocked for role
        code:
          type: string
          example: APPOINTMENT_ENTRY_ROLE_BLOCKED
        details:
          type: object
          additionalProperties: true
    AppointmentConflictErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: Appointment slot conflict detected
        code:
          type: string
          example: APPOINTMENT_SLOT_CONFLICT
        details:
          type: object
          additionalProperties: true
    ValidationErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: appointmentDate must be a valid ISO date-time
        code:
          type: string
          example: APPOINTMENT_PAYLOAD_INVALID
    CalendarProviderStatus:
      type: object
      properties:
        key:
          type: string
          example: google-calendar
        displayName:
          type: string
          example: Google Calendar
        enabled:
          type: boolean
          example: true
        billing:
          type: object
          properties:
            model:
              type: string
              enum:
                - free
                - paid
              example: free
            adminActionRequired:
              type: boolean
              example: true
            setupUrl:
              type: string
              example: https://developers.google.com/calendar
            notes:
              type: string
              example: Admin completes provider account onboarding directly.
    CalendarProviderTestRequest:
      type: object
      required:
        - tenantKey
        - providerKey
        - appointmentId
        - clinicianId
        - patientId
        - startTime
        - endTime
      properties:
        tenantKey:
          type: string
          example: citycare-hospital
        providerKey:
          type: string
          enum:
            - google-calendar
            - apple-calendar
            - outlook-calendar
            - ics-calendar
            - internal-calendar
        appointmentId:
          type: string
          example: apt-1001
        clinicianId:
          type: string
          example: cln-42
        patientId:
          type: string
          example: pat-88
        startTime:
          type: string
          format: date-time
          example: "2026-04-02T09:00:00Z"
        endTime:
          type: string
          format: date-time
          example: "2026-04-02T09:30:00Z"
    CalendarProviderTestResponse:
      type: object
      properties:
        provider:
          type: string
          example: google-calendar
        accepted:
          type: boolean
          example: true
        externalEventId:
          type: string
          example: google-apt-1001
        detail:
          type: string
          example: Booking accepted by provider adapter.
    NotificationDispatchEvent:
      type: object
      properties:
        dispatchId:
          type: string
          example: 198afab8-86ad-47fb-a570-55e5cc6c0de5
        endpoint:
          type: string
          example: http://localhost:5004/api/v1/integrations/appointments/events
        eventType:
          type: string
          enum:
            - appointment.created
            - appointment.status-updated
            - appointment.rescheduled
            - appointment.cancelled
        tenantKey:
          type: string
          example: citycare-hospital
        appointmentId:
          type: string
          example: apt-1001
        correlationId:
          type: string
          example: corr-citycare-hospital-apt-1001-appointment.created
        status:
          type: string
          enum:
            - pending
            - delivered
            - failed
            - skipped
          example: delivered
        attempts:
          type: integer
          minimum: 0
          example: 1
        responseStatus:
          type: integer
          nullable: true
          example: 201
        lastError:
          type: string
          example: ""
        latencyMs:
          type: integer
          nullable: true
          example: 221
        deliveryClass:
          type: string
          enum:
            - pending
            - on-time
            - delayed
            - missed
        remoteReceiptId:
          type: string
          nullable: true
          example: e5d5f243-fd8f-438f-b813-31692c4d3f43
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    NotificationDispatchEventsResponse:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/NotificationDispatchEvent"
        total:
          type: integer
          example: 1
    NotificationDeadLetterEvent:
      allOf:
        - $ref: "#/components/schemas/NotificationDispatchEvent"
        - type: object
          properties:
            deadLetterId:
              type: string
              example: f569620e-df67-4f9e-9d77-14fcd1dfa7a5
            deadLetterReason:
              type: string
              enum:
                - endpoint-not-configured
                - retry-exhausted
                - late-delivery
              example: retry-exhausted
            deadLetteredAt:
              type: string
              format: date-time
            latencyMs:
              type: integer
              nullable: true
              example: 980
    NotificationDeadLetterEventsResponse:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/NotificationDeadLetterEvent"
        total:
          type: integer
          example: 1
        returned:
          type: integer
          example: 1
        limit:
          type: integer
          example: 50
    NotificationDispatchTelemetryCounters:
      type: object
      properties:
        totalDispatches:
          type: integer
          example: 10
        delivered:
          type: integer
          example: 7
        failed:
          type: integer
          example: 2
        skipped:
          type: integer
          example: 1
        pending:
          type: integer
          example: 0
        deadLettered:
          type: integer
          example: 3
        missedReminders:
          type: integer
          example: 3
        delayedReminders:
          type: integer
          example: 1
    NotificationDispatchTelemetryResponse:
      type: object
      properties:
        generatedAt:
          type: string
          format: date-time
        windowMinutes:
          type: integer
          example: 1440
        lateThresholdMs:
          type: integer
          example: 120000
        counters:
          $ref: "#/components/schemas/NotificationDispatchTelemetryCounters"
        byEventType:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/NotificationDispatchTelemetryCounters"
        deliveryRatePct:
          type: number
          format: float
          example: 70
