name: Continuous Deployment

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build the project
        run: npm run build:apps:ci

      - name: Deploy to Production
        run: |
          echo "Deploying to production server..."
          # Add your deployment commands here
          # e.g., scp -r ./dist user@yourserver:/path/to/deploy

      - name: Notify Deployment Success
        run: |
          echo "Deployment successful!"
          # Add your notification commands here
          # e.g., curl -X POST -H 'Content-type: application/json' --data '{"text":"Deployment successful!"}' YOUR_WEBHOOK_URL
