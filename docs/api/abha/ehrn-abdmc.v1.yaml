        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentsApproveRequest"
            examples:
              Example 1:
                value:
                  consents:
                    - hiTypes:
                        - DiagnosticReport
                      hip:
                        id: string
                      careContexts:
                        - patientReference: string
                          careContextReference: string
                      permission:
                        accessMode: VIEW
                        dateRange:
                          from: "2019-08-24T14:15:22Z"
