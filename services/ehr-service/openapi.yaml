openapi: 3.0.0
info:
  title: PulseWard EHR Service API
  description: API for managing electronic health records in the PulseWard Hospital Management System.
  version: 1.0.0
servers:
  - url: http://localhost:5000
    description: Development server
paths:
  /ehr/records/{id}:
    get:
      summary: Retrieve patient records by patient ID
      parameters:
        - name: id
          in: path
          required: true
          description: The patient ID
          schema:
            type: string
      responses:
        "200":
          description: Patient records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Record"
        "404":
          description: No records found
    put:
      summary: Update a patient record by record ID
      parameters:
        - name: id
          in: path
          required: true
          description: The record ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordUpdate"
      responses:
        "200":
          description: Record updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Record"
        "404":
          description: Record not found
    delete:
      summary: Delete a patient record by record ID
      parameters:
        - name: id
          in: path
          required: true
          description: The record ID
          schema:
            type: string
      responses:
        "204":
          description: Record deleted successfully
        "404":
          description: Record not found
components:
  schemas:
    Record:
      type: object
      properties:
        id:
          type: string
          example: "record_12345"
        patientId:
          type: string
          example: "patient_12345"
        summary:
          type: string
          example: "Initial consultation notes"
    RecordUpdate:
      type: object
      additionalProperties: true
