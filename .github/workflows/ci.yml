name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check contract compatibility (M1)
        run: npm run contracts:check -- --strict

      - name: Run tests
        run: npm test

      - name: Build applications
        run: npm run build:apps:ci

      - name: Lint code
        run: npm run lint

      - name: Publish artifacts
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p artifacts
          cp -r apps/* artifacts/
          cp -r services/* artifacts/
          echo "Artifacts published."
