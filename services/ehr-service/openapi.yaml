openapi: 3.0.0
info:
  title: PulseWard EHR Service API
  description: API for EHR record CRUD, clinical write integrity, and record timeline history.
  version: 1.2.0
servers:
  - url: http://localhost:5104
    description: Development server
paths:
  /ehr/records:
    get:
      summary: List EHR records with optional patient and tenant filters
      parameters:
        - name: patientId
          in: query
          required: false
          schema:
            type: string
        - name: tenantKey
          in: query
          required: false
          schema:
            type: string
        - name: includeDeleted
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Filtered EHR record list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EhrRecordListResponse"
    post:
      summary: Create EHR record with initial timeline event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EhrRecordCreateRequest"
      responses:
        "201":
          description: EHR record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EhrRecord"
        "400":
          description: Invalid create payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EhrErrorResponse"
        "409":
          description: Duplicate record id conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EhrErrorResponse"
  /ehr/records/{id}:
    get:
      summary: Retrieve EHR record by record id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: includeDeleted
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: EHR record details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EhrRecord"
        "404":
          description: Record not found or deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EhrErrorResponse"
    put:
      summary: Update EHR record with version integrity checks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EhrRecordUpdateRequest"
      responses:
        "200":
          description: EHR record updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EhrRecord"
        "400":
          description: Invalid patch payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EhrErrorResponse"
        "404":
          description: Record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EhrErrorResponse"
        "409":
          description: Version conflict or deleted record update attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EhrErrorResponse"
    delete:
      summary: Soft-delete EHR record and append timeline event
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EhrRecordDeleteRequest"
      responses:
        "204":
          description: EHR record deleted
        "400":
          description: Missing actor role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EhrErrorResponse"
        "404":
          description: Record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EhrErrorResponse"
  /ehr/records/{id}/timeline:
    get:
      summary: Retrieve immutable timeline events for an EHR record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Timeline events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EhrTimelineResponse"
        "404":
          description: Record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EhrErrorResponse"
components:
  schemas:
    EhrRecord:
      type: object
      properties:
        id:
          type: string
          example: rec-1001
        tenantKey:
          type: string
          example: citycare-hospital
        patientId:
          type: string
          example: pat-88
        clinicianId:
          type: string
          example: cln-42
        encounterType:
          type: string
          example: opd
        encounterAt:
          type: string
          format: date-time
          example: "2026-04-02T09:00:00Z"
        clinicalSummary:
          type: string
          example: Fever and severe headache
        diagnosis:
          type: string
          example: Viral fever
        notes:
          type: string
          example: Follow-up in 3 days
        medications:
          type: array
          items:
            type: string
          example:
            - Paracetamol 500mg
        allergies:
          type: array
          items:
            type: string
          example:
            - Penicillin
        attachments:
          type: array
          items:
            type: string
          example:
            - lab-report-1001.pdf
        status:
          type: string
          enum: [active, deleted]
          example: active
        version:
          type: integer
          example: 2
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
        createdByRole:
          type: string
          example: doctor
        updatedByRole:
          type: string
          nullable: true
          example: doctor
    EhrRecordListResponse:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/EhrRecord"
        total:
          type: integer
          example: 1
        returned:
          type: integer
          example: 1
        limit:
          type: integer
          example: 50
    EhrRecordCreateRequest:
      type: object
      required:
        - actorRole
        - patientId
        - clinicalSummary
        - encounterAt
      properties:
        id:
          type: string
          example: rec-1001
        actorRole:
          type: string
          enum: [admin, doctor, nurse, operations]
          example: doctor
        tenantKey:
          type: string
          example: citycare-hospital
        patientId:
          type: string
          example: pat-88
        clinicianId:
          type: string
          example: cln-42
        encounterType:
          type: string
          example: opd
        encounterAt:
          type: string
          format: date-time
          example: "2026-04-02T09:00:00Z"
        clinicalSummary:
          type: string
          example: Fever and severe headache
        diagnosis:
          type: string
          example: Viral fever
        notes:
          type: string
          example: Follow-up in 3 days
        medications:
          type: array
          items:
            type: string
        allergies:
          type: array
          items:
            type: string
        attachments:
          type: array
          items:
            type: string
    EhrRecordUpdateRequest:
      type: object
      required:
        - actorRole
      properties:
        actorRole:
          type: string
          enum: [admin, doctor, nurse, operations]
          example: doctor
        expectedVersion:
          type: integer
          example: 1
        clinicianId:
          type: string
          example: cln-42
        encounterType:
          type: string
          example: opd
        encounterAt:
          type: string
          format: date-time
          example: "2026-04-02T09:15:00Z"
        clinicalSummary:
          type: string
          example: Fever reduced after medication
        diagnosis:
          type: string
          example: Viral fever improving
        notes:
          type: string
          example: Continue meds for 2 days
        medications:
          type: array
          items:
            type: string
        allergies:
          type: array
          items:
            type: string
        attachments:
          type: array
          items:
            type: string
    EhrRecordDeleteRequest:
      type: object
      required:
        - actorRole
      properties:
        actorRole:
          type: string
          enum: [admin, doctor, operations]
          example: admin
    EhrTimelineEvent:
      type: object
      properties:
        eventId:
          type: string
          example: 1308dad8-6ee5-43bd-bef8-03a3b8dbd46f
        sequence:
          type: integer
          example: 2
        eventType:
          type: string
          example: ehr.record.updated
        actorRole:
          type: string
          example: doctor
        occurredAt:
          type: string
          format: date-time
        details:
          type: object
          additionalProperties: true
    EhrTimelineResponse:
      type: object
      properties:
        recordId:
          type: string
          example: rec-1001
        totalEvents:
          type: integer
          example: 2
        events:
          type: array
          items:
            $ref: "#/components/schemas/EhrTimelineEvent"
    EhrErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: Record version conflict
        code:
          type: string
          example: EHR_RECORD_VERSION_CONFLICT
        details:
          type: object
          additionalProperties: true
