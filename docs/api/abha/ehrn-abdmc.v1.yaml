      operationId: post-v3-patients-find
    parameters:
      - $ref: "#/components/parameters/parameters-tenant"
  /ehrn/abdmc/v3/{tenant}/consent/request/init:
    post:
      summary: HIU - Create consent request - v3
      description: >-
        Creates a consent request to a patient to get their health information.


        ## Note for app developers


        1. Please make sure that the hiuId in the request body is correct

        2. In most situations the hip object will be empty as the requester may
        not know where the data is available

        3. careContext, if added should be already linked. If you are not sure,
        leave empty

        4. Include all the 8 hiTypes always
      parameters:
        - $ref: "#/components/parameters/X-CM-ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentRequest-v3"
            examples:
              Example 1:
                value:
                  consent:
                    purpose:
                      text: Care Management
                      code: CAREMGT
                      refUri: http://abdm.gov.in
                    patient:
                      id: example@sbx
                      name: Example Patient
                    hiu:
                      id: ehrn
                      name: EHR.network
                    requester:
                      name: Dr.Parthiban
                      identifier:
                        value: MH1001
                        type: REGNO
                        system: https://www.mciindia.org
                    hiTypes:
                      - DiagnosticReport
                    permission:
                      accessMode: VIEW
                      dateRange:
                        from: "2019-08-24T14:15:22.000Z"
                        to: "2022-08-24T14:15:22.000Z"
                      dataEraseAt: "2026-08-24T14:15:22.000Z"
                      frequency:
                        unit: HOUR
                        value: 2
                        repeats: 5
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentRequestInitResponse-v3"
              examples:
                Success:
                  value:
                    timestamp: "2019-08-24T14:15:22Z"
                    consentRequest:
                      id: f29f0e59-8388-4698-9fe6-05db67aeac46
                    response:
                      requestId: d385ab22-0f51-4b97-9ecd-b8ff3fd4fcb6
                Error:
                  value:
                    timestamp: "2019-08-24T14:15:22Z"
                    error:
                      code: 1000
                      message: string
                    response:
                      requestId: d385ab22-0f51-4b97-9ecd-b8ff3fd4fcb6
        "400":
          description: |
            **Causes:**
              * Invalid data sent 
              * Required attributes not mentioned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse.v1"
              examples:
                Example 1:
                  value:
                    error:
                      code: 1000
                      message: string
        "401":
          description: |
            **Causes:**
              * Expired/Invalid token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse.v1"
        "500":
          description: |
            **Causes:**
              * Downstream system(s) is down.
              * Unhandled exceptions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse.v1"
      operationId: post-v3-consent-requests-init
      tags:
        - Consent-V3
    parameters:
      - $ref: "#/components/parameters/parameters-tenant"
