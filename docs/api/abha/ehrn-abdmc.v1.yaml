info:
  title: EHR.Network ABDMc APIs
  version: "1.0"
  description: >
    This documentation describes the APIs implemented by ABDMc for the
    healthcare systems(data platform and applications). Using these APIs any
    Healthcare system can fulfill the requirements for the M1, M2 & M3
    certification milestones from ABDM.


    # About ABDM

    Using ABDM's the Federated Health Records framework (FHR), patients can
    access and view their health records, and provide consent to any HIPs and
    HIUs to access their data. This works as a three stage process.

    1. Any HIU can request a patient’s information from another HIP using the
    unique healthID

    2. Patients receives consent request through the consent manager and can
    give fine grained consent 

    3. HIP receives the patient consent and transfers the requested data to the
    HIU directly


    # About ABDMc

    ABDM Connect(ABDMc) from EHR.Network implements the complex asynchronous
    workflows and data transformation required by ABDM network and provides
    simple interfaces for Healthcare systems to integrate with the ABDM network.
    The scope of ABDMc covers M1, M2 & M3 certification requirements from ABDM.


    ## Other developer resources

    Inaddition to this OpenAPI 3.0 API documentation, we will be providing
    additional resources and documents to help healthcare system developers
    integrate their systems with ABDMc and become ABDM compliant.


    1. [Sequence
    diagrams](https://docs.ehr.network/site/abdmc/abha_app_sequence_diagrams/) -
    Please use these sequence diagrams to understand the sequence in which the
    APIs can be executed to build different functionality in healthcare
    systems.
