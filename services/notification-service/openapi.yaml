openapi: 3.0.0
info:
  title: Notification Service API
  description: API for patient/staff notifications and appointment lifecycle event ingestion.
  version: 1.3.0
servers:
  - url: http://localhost:3000/api/v1
paths:
  /notifications:
    get:
      summary: Retrieve all notifications
      responses:
        "200":
          description: A list of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
    post:
      summary: Create a new notification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationCreateRequest"
      responses:
        "201":
          description: Notification created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
  /notifications/{id}:
    get:
      summary: Retrieve a specific notification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A single notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "404":
          description: Notification not found
    delete:
      summary: Delete a specific notification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Notification deleted successfully
        "404":
          description: Notification not found
  /integrations/appointments/events:
    get:
      summary: List ingested appointment lifecycle event receipts
      parameters:
        - name: tenantKey
          in: query
          required: false
          schema:
            type: string
        - name: appointmentId
          in: query
          required: false
          schema:
            type: string
        - name: eventType
          in: query
          required: false
          schema:
            type: string
            enum:
              - appointment.created
              - appointment.status-updated
              - appointment.rescheduled
              - appointment.cancelled
        - name: correlationId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Appointment event receipt list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentEventReceiptListResponse"
    post:
      summary: Ingest appointment lifecycle event with idempotent correlation handling
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentEventIngestRequest"
      responses:
        "200":
          description: Duplicate correlation replay, existing receipt returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentEventIngestResponse"
        "201":
          description: Appointment event accepted and notification created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentEventIngestResponse"
        "400":
          description: Invalid appointment event payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationErrorResponse"
  /integrations/appointments/events/{id}:
    get:
      summary: Get appointment lifecycle receipt by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Appointment event receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentEventReceipt"
        "404":
          description: Appointment event receipt not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationErrorResponse"
  /integrations/messaging/providers:
    get:
      summary: List messaging providers for a tenant
      parameters:
        - name: tenantKey
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Messaging providers for the tenant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MessagingProviderStatus"
  /integrations/messaging/test:
    post:
      summary: Test messaging provider delivery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessagingProviderTestRequest"
      responses:
        "200":
          description: Provider test completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagingProviderTestResponse"
  /integrations/messaging/telegram/setup:
    get:
      summary: Get Telegram bot setup checklist for a tenant
      parameters:
        - name: tenantKey
          in: query
          required: false
          schema:
            type: string
            default: default
      responses:
        "200":
          description: Telegram setup guidance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramSetupResponse"
  /integrations/messaging/telegram/config-status:
    get:
      summary: Get Telegram configuration status from environment secret reference
      parameters:
        - name: tenantKey
          in: query
          required: false
          schema:
            type: string
            default: default
      responses:
        "200":
          description: Telegram configuration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramConfigStatusResponse"
  /integrations/messaging/whatsapp/setup:
    get:
      summary: Get WhatsApp Cloud API onboarding checklist for a tenant
      parameters:
        - name: tenantKey
          in: query
          required: false
          schema:
            type: string
            default: default
      responses:
        "200":
          description: WhatsApp setup guidance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppSetupResponse"
  /integrations/messaging/whatsapp/config-status:
    get:
      summary: Get WhatsApp Cloud API configuration status from environment secret reference
      parameters:
        - name: tenantKey
          in: query
          required: false
          schema:
            type: string
            default: default
      responses:
        "200":
          description: WhatsApp configuration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppConfigStatusResponse"
  /integrations/messaging/email/config-status:
    get:
      summary: Get SMTP email configuration status from environment secret reference
      parameters:
        - name: tenantKey
          in: query
          required: false
          schema:
            type: string
            default: default
      responses:
        "200":
          description: Email configuration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailConfigStatusResponse"
components:
  schemas:
    Notification:
      type: object
      properties:
        id:
          type: string
          example: ntf-1001
        message:
          type: string
          example: Your appointment is confirmed.
        recipient:
          type: string
          example: pat-1001
        channel:
          type: string
          example: appointment-lifecycle
        timestamp:
          type: string
          format: date-time
        correlationId:
          type: string
          example: corr-citycare-apt-1001-appointment.created
        sourceService:
          type: string
          example: appointment-service
        metadata:
          type: object
          additionalProperties: true
    NotificationCreateRequest:
      type: object
      properties:
        message:
          type: string
          example: Your prescription is ready for pickup.
        recipient:
          type: string
          example: patient@example.com
    AppointmentEventIngestRequest:
      type: object
      required:
        - tenantKey
        - appointmentId
        - eventType
        - correlationId
        - message
        - recipient
      properties:
        tenantKey:
          type: string
          example: citycare-hospital
        appointmentId:
          type: string
          example: apt-1001
        patientId:
          type: string
          example: pat-1001
        clinicianId:
          type: string
          example: cln-42
        eventType:
          type: string
          enum:
            - appointment.created
            - appointment.status-updated
            - appointment.rescheduled
            - appointment.cancelled
        correlationId:
          type: string
          example: corr-citycare-apt-1001-appointment.created
        sourceService:
          type: string
          example: appointment-service
        occurredAt:
          type: string
          format: date-time
        channel:
          type: string
          example: appointment-lifecycle
        recipient:
          type: string
          example: pat-1001
        message:
          type: string
          example: Appointment created for pat-1001 at 2026-04-03T09:00:00Z
        attempt:
          type: integer
          example: 1
        metadata:
          type: object
          additionalProperties: true
    AppointmentEventReceipt:
      type: object
      properties:
        id:
          type: string
          example: rec-1001
        tenantKey:
          type: string
          example: citycare-hospital
        appointmentId:
          type: string
          example: apt-1001
        patientId:
          type: string
          example: pat-1001
        clinicianId:
          type: string
          example: cln-42
        eventType:
          type: string
          example: appointment.created
        correlationId:
          type: string
          example: corr-citycare-apt-1001-appointment.created
        notificationId:
          type: string
          example: ntf-1001
        processingStatus:
          type: string
          example: accepted
        attempts:
          type: integer
          example: 1
        occurredAt:
          type: string
          format: date-time
        receivedAt:
          type: string
          format: date-time
    AppointmentEventIngestResponse:
      type: object
      properties:
        duplicate:
          type: boolean
          example: false
        receipt:
          $ref: "#/components/schemas/AppointmentEventReceipt"
        notification:
          $ref: "#/components/schemas/Notification"
    AppointmentEventReceiptListResponse:
      type: object
      properties:
        receipts:
          type: array
          items:
            $ref: "#/components/schemas/AppointmentEventReceipt"
        total:
          type: integer
          example: 2
    NotificationErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: appointment lifecycle event payload is invalid
        code:
          type: string
          example: NOTIFICATION_APPOINTMENT_EVENT_INVALID
        details:
          type: object
          additionalProperties: true
    MessagingProviderStatus:
      type: object
      properties:
        key:
          type: string
          example: whatsapp-cloud-api
        displayName:
          type: string
          example: WhatsApp Cloud API
        enabled:
          type: boolean
          example: true
        billing:
          type: object
          properties:
            model:
              type: string
              enum:
                - free
                - paid
              example: free
            adminActionRequired:
              type: boolean
              example: true
            setupUrl:
              type: string
              example: https://core.telegram.org/bots
            notes:
              type: string
              example: Admin completes external provider onboarding directly.
    MessagingProviderTestRequest:
      type: object
      required:
        - tenantKey
        - message
      properties:
        tenantKey:
          type: string
          example: citycare-hospital
        channel:
          type: string
          example: patient-notification
        providerKey:
          type: string
          enum:
            - whatsapp-cloud-api
            - telegram-bot
            - generic-webhook
            - email-smtp
            - sms-gateway
        recipient:
          type: string
          example: +919900000000
        message:
          type: string
          example: Test message from PulseWard notification service.
        dryRun:
          type: boolean
          default: true
          example: true
        credentialsOverride:
          type: object
          description: Optional one-time provider credentials payload for setup tests.
          additionalProperties: true
    MessagingProviderTestResponse:
      type: object
      properties:
        provider:
          type: string
          example: whatsapp-cloud-api
        accepted:
          type: boolean
          example: true
        detail:
          type: string
          example: Message accepted by provider adapter.
    TelegramSetupResponse:
      type: object
      properties:
        tenantKey:
          type: string
          example: citycare-hospital
        providerEnabled:
          type: boolean
          example: true
        setupSteps:
          type: array
          items:
            type: string
    TelegramConfigStatusResponse:
      type: object
      properties:
        tenantKey:
          type: string
          example: default
        providerEnabled:
          type: boolean
          example: true
        secretKey:
          type: string
          example: INTEGRATION_TELEGRAM_CREDENTIALS
        configured:
          type: boolean
          example: false
        hasChatId:
          type: boolean
          example: false
    WhatsAppSetupResponse:
      type: object
      properties:
        tenantKey:
          type: string
          example: citycare-hospital
        providerEnabled:
          type: boolean
          example: false
        setupSteps:
          type: array
          items:
            type: string
    WhatsAppConfigStatusResponse:
      type: object
      properties:
        tenantKey:
          type: string
          example: default
        providerEnabled:
          type: boolean
          example: false
        secretKey:
          type: string
          example: INTEGRATION_WHATSAPP_CREDENTIALS
        configured:
          type: boolean
          example: false
        hasAccessToken:
          type: boolean
          example: false
        hasPhoneNumberId:
          type: boolean
          example: false
        hasSenderNumber:
          type: boolean
          example: false
    EmailConfigStatusResponse:
      type: object
      properties:
        tenantKey:
          type: string
          example: default
        providerEnabled:
          type: boolean
          example: true
        secretKey:
          type: string
          example: INTEGRATION_EMAIL_SMTP_CREDENTIALS
        configured:
          type: boolean
          example: false
        hasFromAddress:
          type: boolean
          example: false
