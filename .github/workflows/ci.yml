name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Check contract compatibility (M1)
        run: pnpm run contracts:check -- --strict

      - name: Run tests
        run: pnpm test

      - name: Build applications
        run: pnpm build

      - name: Lint code
        run: pnpm lint

      - name: Publish artifacts
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p artifacts
          cp -r apps/* artifacts/
          cp -r services/* artifacts/
          echo "Artifacts published."
