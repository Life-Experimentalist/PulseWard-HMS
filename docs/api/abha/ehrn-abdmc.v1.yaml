      - $ref: "#/components/parameters/tenant"
    post:
      summary: Register a provider in NHCX
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                x-examples:
                  Example 1:
                    participantid: XXXXX7583@hcx
                    facilityname: TEST Hospitals
                    facilitycontact: XXXXXXX452
                    facilityemail: sample@gmail.com
                    transactionid: 1vouv8tlz2tnl-1fpspjhwj07c6
                    error:
                      code: null
                      message: null
                properties:
                  participantid:
                    type: string
                    example: XXXXX7583@hcx
                  facilityname:
                    type: string
                    example: TEST Hospitals
                  facilitycontact:
                    type: string
                    example: "1234567890"
                  facilityemail:
                    type: string
                    example: test@test.com
                  transactionid:
                    type: string
                    format: uuid
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      trace:
                        type: string
                        x-stoplight:
                          id: peh56ledkj5u8
              examples:
                Example 1:
                  value:
                    participantid: XXXXX7583@hcx
                    facilityname: TEST Hospitals
                    facilitycontact: "1234567890"
                    facilityemail: test@test.com
                    transactionid: af9e145d-03e1-46d9-b5c0-938aea8a0702
                Example 2:
                  value:
                    participantid: XXXXX7583@hcx
                    facilityname: TEST Hospitals
                    facilitycontact: "1234567890"
                    facilityemail: test@test.com
                    transactionid: af9e145d-03e1-46d9-b5c0-938aea8a0702
                    error:
                      code: string
                      message: string
                      trace: string
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      trace:
                        type: string
                x-examples:
                  Example 1:
                    error:
                      code: string
                      message: string
                      trace: string
              examples:
                Example 1:
                  value:
                    error:
                      code: string
                      message: string
                      trace: string
      tags:
        - NHCX-Onboarding
      operationId: post-ehrn-abdmc-v2-tenant-participant-create
      requestBody:
        content:
          application/json:
            schema:
              type: object
              x-examples:
                Example 1:
                  registrytype: 1000X
                  registryid: "12345678934"
                  role:
                    - 1000X
                  endpoint_url: www.test.com
                  mobilenumber: "1234567890"
                  email: test01@gmail.com
              properties:
                mobilenumber:
                  type: string
                  example: "1234567890"
                email:
                  type: string
                  example: test@test.com
            examples:
              Example 1:
                value:
                  mobilenumber: "1234567890"
                  email: test@test.com
      description: >-
        Register a new Provider with the NHCX. Only registered participants will
        be able to transact via NHCX.


        On successful registration, an OTP will be sent to the mobile number
        provided for validation.


        ** Note: This API works only in production environment **


        ## For NHCXS developers


        1. registrytype - Use 10001 by default

        2. registryid - Resolve facilityId using tenant from facility collection

        3. role - Use 10001 always

        4. endpoint_url - Add callbackUrl configured in zookeeper
  /ehrn/abdmc/v1/{tenant}/validate:
    parameters:
      - $ref: "#/components/parameters/tenant"
    get:
      summary: Return OTP to validate participant registration
      responses:
        "200":
          description: OK
      parameters:
        - schema:
            type: string
            format: uuid
          in: query
          name: transactionId
          description: TransactionId received for the register request
        - schema:
            type: string
            example: "1234"
          in: query
          name: passcode
          description: OTP received on given mobile
      description: >-
        Return the OTP received for the registration API to confirm the
        Participant registration
      tags:
        - NHCX-Onboarding
      operationId: get-ehrn-abdmc-v1-tenant-validate
  /ehrn/abdmc/v2/{tenant}/participant/update:
    parameters:
      - $ref: "#/components/parameters/tenant"
    post:
      summary: Update participant details on NHCX
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                x-examples:
                  Example 1:
                    participant_code: XXXXX78934@hcx
                    status: ""
                    transactionid: 1fdesnz05o61g-1dl43hc511j1g
                properties:
                  participant_code:
                    type: string
                    example: XXXXX78934@hcx
                  status:
                    type: string
                  transactionid:
                    type: string
                    format: uuid
              examples:
                Example 1:
                  value:
                    participant_code: XXXXX78934@hcx
                    status: string
                    transactionid: af9e145d-03e1-46d9-b5c0-938aea8a0702
      tags:
        - NHCX-Onboarding
      operationId: post-ehrn-abdmc-v2-tenant-participant-update
      description: >-
        Update a participant. Registers the callbackURL and public key of the
        provider.


        ** Note: This API works only in production environment **


        ## For NHCXS developers

        No payload will be sent by the app. NHCXS will compose this as below

        1. participantcode - Lookup from the partcipant collection using tenant

        2. encryptioncert - Generate and add the participant public key

        3. endpointurl - Callback url from zookeeper
  /ehrn/abdmc/v1/{tenant}/update/validate:
    parameters:
      - $ref: "#/components/parameters/tenant"
    get:
      summary: Return the OTP to confirm participant update
      responses:
        "200":
          description: OK
      parameters:
        - schema:
            type: string
          in: query
          name: transactionId
          description: TransactionId received for update request
        - schema:
            type: string
            example: "123456"
          in: query
          name: passcode
          description: OTP received on registered participant mobile
      tags:
        - NHCX-Onboarding
      operationId: get-ehrn-abdmc-v1-tenant-update-validate
      description: Validate particpant update
