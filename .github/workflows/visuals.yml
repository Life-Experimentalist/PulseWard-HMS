name: Automated Visuals

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  generate-visuals:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Generate SVG visuals from Mermaid diagrams
        run: node ./scripts/generate-mermaid-visuals.mjs

      - name: Upload generated visuals
        uses: actions/upload-artifact@v4
        with:
          name: docs-visuals
          path: |
            docs/visuals/generated
            docs/visuals/source
            docs/visuals/manifest.json
