openapi: 3.0.0
info:
  title: PulseWard EHR Service API
  description: API for managing electronic health records in the PulseWard Hospital Management System.
  version: 1.0.0
servers:
  - url: http://localhost:5000/api/v1
    description: Development server
paths:
  /patients:
    get:
      summary: Retrieve a list of patients
      responses:
        "200":
          description: A list of patients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Patient"
    post:
      summary: Create a new patient record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Patient"
      responses:
        "201":
          description: Patient created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
  /patients/{patientId}:
    get:
      summary: Retrieve a specific patient by ID
      parameters:
        - name: patientId
          in: path
          required: true
          description: The ID of the patient to retrieve
          schema:
            type: string
      responses:
        "200":
          description: Patient details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "404":
          description: Patient not found
    put:
      summary: Update a patient record
      parameters:
        - name: patientId
          in: path
          required: true
          description: The ID of the patient to update
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Patient"
      responses:
        "200":
          description: Patient updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
        "404":
          description: Patient not found
    delete:
      summary: Delete a patient record
      parameters:
        - name: patientId
          in: path
          required: true
          description: The ID of the patient to delete
          schema:
            type: string
      responses:
        "204":
          description: Patient deleted successfully
        "404":
          description: Patient not found
components:
  schemas:
    Patient:
      type: object
      properties:
        id:
          type: string
          example: "12345"
        name:
          type: string
          example: "John Doe"
        dateOfBirth:
          type: string
          format: date
          example: "1980-01-01"
        gender:
          type: string
          enum: [male, female, other]
          example: "male"
        medicalHistory:
          type: array
          items:
            type: string
          example: ["Diabetes", "Hypertension"]
