openapi: 3.0.0
info:
  title: PulseWard Authentication Service
  description: API for role-based authentication, OAuth provider setup, and tenant domain resolution.
  version: 1.2.0
servers:
  - url: http://localhost:8081/api/v1
    description: Development server
paths:
  /auth/roles:
    get:
      summary: List supported role keys
      tags:
        - Auth
      responses:
        "200":
          description: Supported role keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles:
                    type: array
                    items:
                      type: string

  /auth/otp/request:
    post:
      summary: Create tenant-scoped OTP challenge for role login flow
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "200":
          description: OTP challenge issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpChallengeResponse"
        "400":
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: OTP flow blocked by tenant auth policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthPolicyDeniedResponse"

  /auth/otp/verify:
    post:
      summary: Verify OTP challenge and issue short-lived OTP verified token
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyRequest"
      responses:
        "200":
          description: OTP verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpVerifyResponse"
        "400":
          description: Invalid, expired, or missing OTP challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpVerifyErrorResponse"

  /auth/register:
    post:
      summary: Register a user for a tenant and role
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      summary: Login and receive JWT token
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Successful login
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Login blocked by tenant auth policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthPolicyDeniedResponse"
        "401":
          description: MFA required by tenant policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaRequiredResponse"

  /auth/oauth/providers:
    get:
      summary: List OAuth providers and enablement state
      tags:
        - OAuth
      parameters:
        - name: tenantKey
          in: query
          required: false
          schema:
            type: string
            default: default
      responses:
        "200":
          description: Provider catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthProvidersResponse"

  /auth/oauth/google/start:
    get:
      summary: Build Google OAuth URL for tenant and role
      tags:
        - OAuth
      parameters:
        - name: tenantKey
          in: query
          required: false
          schema:
            type: string
            default: default
        - name: role
          in: query
          required: false
          schema:
            type: string
            default: patient
      responses:
        "200":
          description: Google OAuth bootstrap payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleOAuthStartResponse"
        "403":
          description: Google OAuth flow blocked by tenant auth policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthPolicyDeniedResponse"

  /auth/oauth/google/callback:
    post:
      summary: Exchange OAuth callback payload for a platform JWT
      tags:
        - OAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleOAuthCallbackRequest"
      responses:
        "200":
          description: OAuth login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleOAuthCallbackResponse"
        "403":
          description: Google OAuth callback blocked by tenant auth policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthPolicyDeniedResponse"

  /auth/oauth/clerk/start:
    get:
      summary: Get Clerk setup metadata for tenant login
      tags:
        - OAuth
      parameters:
        - name: tenantKey
          in: query
          required: false
          schema:
            type: string
            default: default
        - name: role
          in: query
          required: false
          schema:
            type: string
            default: patient
      responses:
        "200":
          description: Clerk bootstrap metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClerkStartResponse"
        "403":
          description: Clerk flow blocked by tenant auth policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthPolicyDeniedResponse"

  /auth/oauth/google/config-status:
    get:
      summary: Get Google OAuth environment configuration readiness
      tags:
        - OAuth
      responses:
        "200":
          description: Google OAuth configuration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleOAuthConfigStatusResponse"

  /platform/abha/config-status:
    get:
      summary: Get ABHA integration environment readiness
      tags:
        - Platform Domains
      responses:
        "200":
          description: ABHA configuration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbhaConfigStatusResponse"

  /platform/abha/health-check:
    get:
      summary: Check ABHA gateway reachability
      tags:
        - Platform Domains
      parameters:
        - name: timeoutMs
          in: query
          required: false
          schema:
            type: integer
            default: 4000
      responses:
        "200":
          description: ABHA gateway check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbhaHealthCheckResponse"
        "400":
          description: ABHA gateway configuration missing or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbhaHealthCheckResponse"
        "502":
          description: ABHA gateway check failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbhaHealthCheckResponse"

  /admin/settings/storage:
    get:
      summary: Get admin settings storage metadata
      tags:
        - Admin Settings
      responses:
        "200":
          description: Settings storage details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettingsStorageResponse"

  /admin/settings:
    get:
      summary: Get admin dashboard settings for a tenant
      tags:
        - Admin Settings
      parameters:
        - name: tenantKey
          in: query
          required: false
          schema:
            type: string
            default: default
      responses:
        "200":
          description: Tenant settings payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettingsResponse"
    put:
      summary: Save admin dashboard settings for a tenant
      tags:
        - Admin Settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSettingsUpdateRequest"
      responses:
        "200":
          description: Settings persisted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSettingsResponse"
        "400":
          description: Invalid admin settings payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthPolicyValidationResponse"

  /admin/settings/auth-policy/validate:
    post:
      summary: Validate tenant auth policy payload without persisting
      tags:
        - Admin Settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAuthPolicyValidationRequest"
      responses:
        "200":
          description: Auth policy payload is valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthPolicyValidationResponse"
        "400":
          description: Auth policy payload is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthPolicyValidationResponse"

  /platform/domain-config:
    get:
      summary: Resolve platform and tenant domain config
      tags:
        - Platform Domains
      parameters:
        - name: tenantKey
          in: query
          required: false
          schema:
            type: string
            default: default
      responses:
        "200":
          description: Resolved domain config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedDomainConfig"

  /platform/domain-config/validate:
    post:
      summary: Validate a browser origin for a tenant
      tags:
        - Platform Domains
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DomainValidationRequest"
      responses:
        "200":
          description: Domain validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainValidationResponse"
        "400":
          description: Missing tenantKey or origin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /platform/domain-config/all:
    get:
      summary: Get full domain configuration model
      tags:
        - Platform Domains
      responses:
        "200":
          description: Full domain configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainConfig"

components:
  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - role
      properties:
        email:
          type: string
          format: email
          example: admin@citycare.example.com
        password:
          type: string
          example: secure-password
        role:
          type: string
          example: admin
        tenantKey:
          type: string
          example: citycare-hospital
    OtpRequest:
      type: object
      required:
        - tenantKey
        - role
      properties:
        tenantKey:
          type: string
          example: citycare-hospital
        role:
          type: string
          example: doctor
        recipient:
          type: string
          example: doctor@citycare.example.com
    OtpChallengeResponse:
      type: object
      properties:
        challengeId:
          type: string
          example: 9f1fbf9a-1497-4c7f-a8df-43d0863218ba
        tenantKey:
          type: string
          example: citycare-hospital
        role:
          type: string
          example: doctor
        deliveryChannel:
          type: string
          enum:
            - email
            - phone
            - both
          example: email
        expiresInSeconds:
          type: integer
          example: 300
        detail:
          type: string
          example: OTP challenge generated
        demoCode:
          type: string
          nullable: true
          example: "123456"
    OtpVerifyRequest:
      type: object
      required:
        - challengeId
        - code
      properties:
        challengeId:
          type: string
          example: 9f1fbf9a-1497-4c7f-a8df-43d0863218ba
        code:
          type: string
          example: "123456"
    OtpVerifyResponse:
      type: object
      properties:
        verified:
          type: boolean
          example: true
        tenantKey:
          type: string
          example: citycare-hospital
        role:
          type: string
          example: doctor
        otpVerifiedToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        expiresInMinutes:
          type: integer
          example: 10
    OtpVerifyErrorResponse:
      type: object
      properties:
        verified:
          type: boolean
          example: false
        code:
          type: string
          example: OTP_CODE_INVALID
        message:
          type: string
          example: Invalid OTP code
    RegisterResponse:
      type: object
      properties:
        userId:
          type: string
          example: 6d6df4ee-c329-437f-a88b-1d4a2082f9f9
        message:
          type: string
          example: User registered
    LoginRequest:
      type: object
      required:
        - email
        - password
        - role
      properties:
        email:
          type: string
          format: email
          example: admin@citycare.example.com
        password:
          type: string
          example: secure-password
        role:
          type: string
          example: admin
        tenantKey:
          type: string
          example: citycare-hospital
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        provider:
          type: string
          example: email-password
        role:
          type: string
          example: admin
        tenantKey:
          type: string
          example: citycare-hospital
        session:
          $ref: "#/components/schemas/AuthSessionMetadata"
    OAuthProvidersResponse:
      type: object
      properties:
        tenantKey:
          type: string
          example: citycare-hospital
        authPolicy:
          $ref: "#/components/schemas/AdminAuthPolicy"
        providers:
          type: array
          items:
            $ref: "#/components/schemas/OAuthProviderStatus"
    OAuthProviderStatus:
      type: object
      properties:
        key:
          type: string
          example: google-oauth
        envEnabled:
          type: boolean
          example: true
        policyEnabled:
          type: boolean
          example: true
        enabled:
          type: boolean
          example: true
        mode:
          type: string
          enum:
            - free
            - paid-optional
          example: free
    GoogleOAuthStartResponse:
      type: object
      properties:
        provider:
          type: string
          example: google-oauth
        oauthUrl:
          type: string
          example: https://accounts.google.com/o/oauth2/v2/auth?client_id=...
        note:
          type: string
          example: Admin must configure Google OAuth client in console.
    GoogleOAuthCallbackRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: doctor@citycare.example.com
        role:
          type: string
          example: doctor
        tenantKey:
          type: string
          example: citycare-hospital
    GoogleOAuthCallbackResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        provider:
          type: string
          example: google-oauth
        role:
          type: string
          example: doctor
        tenantKey:
          type: string
          example: citycare-hospital
        session:
          $ref: "#/components/schemas/AuthSessionMetadata"
    AuthSessionMetadata:
      type: object
      properties:
        expiresInMinutes:
          type: integer
          example: 60
    MfaRequiredResponse:
      type: object
      properties:
        message:
          type: string
          example: MFA required for this tenant policy
        code:
          type: string
          example: MFA_REQUIRED
        details:
          type: object
          properties:
            tenantKey:
              type: string
              example: citycare-hospital
            role:
              type: string
              example: doctor
            requiredProvider:
              type: string
              example: otp
            hint:
              type: string
              example: Complete /auth/otp/request and /auth/otp/verify before login
    AuthPolicyDeniedResponse:
      type: object
      properties:
        message:
          type: string
          example: Auth flow blocked by tenant policy
        code:
          type: string
          example: AUTH_POLICY_PROVIDER_BLOCKED
        details:
          type: object
          properties:
            tenantKey:
              type: string
              example: citycare-hospital
            provider:
              type: string
              example: google-oauth
            action:
              type: string
              example: auth.oauth.google.callback
            role:
              type: string
              nullable: true
              example: doctor
            enabledProviders:
              type: array
              items:
                type: string
              example:
                - email-password
                - otp
            roleAllowedProviders:
              type: array
              items:
                type: string
              example:
                - email-password
                - otp
        audit:
          type: object
          properties:
            eventType:
              type: string
              example: auth.policy.denied
            eventId:
              type: string
              example: b6c307cc-6bb7-4d4c-bff4-af50de93f615
            occurredAt:
              type: string
              format: date-time
    ClerkStartResponse:
      type: object
      properties:
        provider:
          type: string
          example: clerk
        tenantKey:
          type: string
          example: citycare-hospital
        note:
          type: string
          example: Configure Clerk frontend SDK with tenant context and callback URL.
        publishableKeyConfigured:
          type: boolean
          example: false
    GoogleOAuthConfigStatusResponse:
      type: object
      properties:
        provider:
          type: string
          example: google-oauth
        configured:
          type: boolean
          example: false
        redirectUri:
          type: string
          example: http://localhost:8081/api/v1/auth/oauth/google/callback
        hasClientId:
          type: boolean
          example: false
        hasClientSecret:
          type: boolean
          example: false
    AbhaConfigStatusResponse:
      type: object
      properties:
        enabled:
          type: boolean
          example: false
        configured:
          type: boolean
          example: false
        hasClientId:
          type: boolean
          example: false
        hasClientSecret:
          type: boolean
          example: false
        hasGatewayBaseUrl:
          type: boolean
          example: false
        gatewayBaseUrl:
          type: string
          example: https://abha-gateway.example.com
        mode:
          type: string
          example: sandbox
    AbhaHealthCheckResponse:
      type: object
      properties:
        reachable:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 200
        checkedUrl:
          type: string
          example: https://abha-gateway.example.com/
        latencyMs:
          type: integer
          example: 142
        timeoutMs:
          type: integer
          example: 4000
        detail:
          type: string
          example: ABHA gateway responded successfully
        error:
          type: string
          nullable: true
          example: connect ETIMEDOUT
    AdminSettingsStorageResponse:
      type: object
      properties:
        source:
          type: string
          example: auth-service-json-store
        path:
          type: string
          example: services/auth-service/data/admin-console-settings.json
        tenantCount:
          type: integer
          example: 2
        updatedAt:
          type: string
          format: date-time
          nullable: true
    AdminSettingsRouting:
      type: object
      properties:
        tenantKey:
          type: string
          example: default
        authBaseUrl:
          type: string
          format: uri
          example: http://localhost:5101
        notificationBaseUrl:
          type: string
          format: uri
          example: http://localhost:5102
        appointmentBaseUrl:
          type: string
          format: uri
          example: http://localhost:5103
    AdminSettingsUi:
      type: object
      properties:
        lastTab:
          type: string
          example: overview
    AdminAuthPolicy:
      type: object
      properties:
        enabledProviders:
          type: array
          items:
            type: string
            enum:
              - email-password
              - otp
              - google-oauth
              - clerk
          example:
            - email-password
            - otp
            - google-oauth
            - clerk
        primaryProvider:
          type: string
          enum:
            - email-password
            - otp
            - google-oauth
            - clerk
          example: email-password
        otpChannel:
          type: string
          enum:
            - email
            - phone
            - both
          example: email
        mfaRequired:
          type: boolean
          example: false
        mfaRequiredRoles:
          type: array
          items:
            type: string
            enum:
              - admin
              - doctor
              - nurse
              - patient
              - frontdesk
              - operations
          example:
            - doctor
            - nurse
        sessionTtlMinutes:
          type: integer
          minimum: 15
          maximum: 1440
          example: 60
        roleSessionTtlMinutes:
          type: object
          additionalProperties:
            type: integer
            minimum: 15
            maximum: 1440
          example:
            doctor: 30
            nurse: 45
        roleProviderOverrides:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
              enum:
                - email-password
                - otp
                - google-oauth
                - clerk
          example:
            doctor:
              - email-password
              - google-oauth
            patient:
              - otp
        passwordMinLength:
          type: integer
          minimum: 8
          maximum: 128
          example: 8
        allowSelfRegistration:
          type: boolean
          example: false
    AdminSettingsPayload:
      type: object
      properties:
        routing:
          $ref: "#/components/schemas/AdminSettingsRouting"
        ui:
          $ref: "#/components/schemas/AdminSettingsUi"
        authPolicy:
          $ref: "#/components/schemas/AdminAuthPolicy"
    AdminSettingsResponse:
      type: object
      properties:
        tenantKey:
          type: string
          example: default
        settings:
          $ref: "#/components/schemas/AdminSettingsPayload"
        updatedAt:
          type: string
          format: date-time
          nullable: true
        storage:
          $ref: "#/components/schemas/AdminSettingsStorageResponse"
    AdminSettingsUpdateRequest:
      type: object
      required:
        - tenantKey
        - settings
      properties:
        tenantKey:
          type: string
          example: default
        settings:
          $ref: "#/components/schemas/AdminSettingsPayload"
    AdminAuthPolicyValidationRequest:
      type: object
      required:
        - authPolicy
      properties:
        tenantKey:
          type: string
          example: default
        authPolicy:
          $ref: "#/components/schemas/AdminAuthPolicy"
    AdminAuthPolicyValidationResponse:
      type: object
      properties:
        valid:
          type: boolean
          example: true
        tenantKey:
          type: string
          example: default
        authPolicy:
          $ref: "#/components/schemas/AdminAuthPolicy"
        errors:
          type: array
          items:
            type: string
          example: []
    DomainValidationRequest:
      type: object
      required:
        - tenantKey
        - origin
      properties:
        tenantKey:
          type: string
          example: citycare-hospital
        origin:
          type: string
          format: uri
          example: https://citycare.pulseward.example.com
    DomainValidationResponse:
      type: object
      properties:
        allowed:
          type: boolean
          example: true
        tenantKey:
          type: string
          example: citycare-hospital
        origin:
          type: string
          format: uri
          example: https://citycare.pulseward.example.com
    DomainConfig:
      type: object
      properties:
        platform:
          $ref: "#/components/schemas/PlatformDomainSettings"
        tenants:
          type: array
          items:
            $ref: "#/components/schemas/TenantDomainSettings"
    ResolvedDomainConfig:
      type: object
      properties:
        platform:
          $ref: "#/components/schemas/PlatformDomainSettings"
        tenant:
          $ref: "#/components/schemas/TenantDomainSettings"
    PlatformDomainSettings:
      type: object
      properties:
        hostingMode:
          type: string
          enum:
            - github-subdomain
            - custom-domain
            - hybrid
          example: hybrid
        githubSubdomain:
          type: string
          format: uri
          example: https://life-experimentalist.github.io/pulseward-hms
        primaryCustomDomain:
          type: string
          format: uri
          example: https://pulseward.example.com
        apiBasePath:
          type: string
          example: /api/v1
    TenantDomainSettings:
      type: object
      properties:
        tenantKey:
          type: string
          example: citycare-hospital
        landingDomain:
          type: string
          format: uri
          example: https://citycare.pulseward.example.com
        apiDomain:
          type: string
          format: uri
          example: https://citycare-api.pulseward.example.com
        allowedOrigins:
          type: array
          items:
            type: string
            format: uri
          example:
            - https://citycare.pulseward.example.com
            - https://citycare.example.com
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: Invalid credentials
