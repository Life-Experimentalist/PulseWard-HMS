name: Bug report
description: Report a defect affecting PulseWard behavior or reliability.
title: "[Bug]: "
labels:
  - bug
  - triage
body:
  - type: markdown
    attributes:
      value: |
        Please provide enough detail to reproduce and assess patient/operational impact.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
      placeholder: Concise description of the defect.
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact level
      options:
        - Critical (patient safety/privacy or production outage)
        - High (major workflow blocked)
        - Medium (partial degradation)
        - Low (minor issue)
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include exact steps, inputs, and expected vs actual behavior.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: contracts
    attributes:
      label: Routes or portals affected
      description: Mention the API routes and/or portals impacted.
      placeholder: "/api/v1/appointments, clinician-portal, admin-console ... etc."
  - type: textarea
    id: logs
    attributes:
      label: Logs and evidence
      description: Paste sanitized logs, screenshots, or traces.
  - type: textarea
    id: rollback
    attributes:
      label: Mitigation or rollback
      description: Known workaround, feature flag, or rollback path.
