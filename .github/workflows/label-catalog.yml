name: Label Catalog Sync

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  issues: write

jobs:
  sync-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure required labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const required = [
              { name: 'triage', color: '0e8a16', description: 'Needs initial triage' },
              { name: 'needs-review', color: '5319e7', description: 'Requires architectural or safety review' },
              { name: 'incident', color: 'd93f0b', description: 'Operational incident tracking' },
              { name: 'operations', color: '1d76db', description: 'Operations-related work' },
              { name: 'backup', color: '0052cc', description: 'Backup and recovery related' },
              { name: 'branding', color: 'fbca04', description: 'Branding and design configuration' },
              { name: 'configuration', color: 'c2e0c6', description: 'Configuration-level changes' },
              { name: 'severity:critical', color: 'b60205', description: 'Critical severity' },
              { name: 'severity:high', color: 'd93f0b', description: 'High severity' },
              { name: 'severity:medium', color: 'fbca04', description: 'Medium severity' },
              { name: 'severity:low', color: '0e8a16', description: 'Low severity' }
            ];

            const existing = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner,
              repo,
              per_page: 100
            });

            const existingMap = new Map(existing.map((l) => [l.name, l]));

            for (const label of required) {
              if (!existingMap.has(label.name)) {
                await github.rest.issues.createLabel({ owner, repo, ...label });
                core.info(`Created label: ${label.name}`);
                continue;
              }

              const current = existingMap.get(label.name);
              if (current.color !== label.color || (current.description || '') !== label.description) {
                await github.rest.issues.updateLabel({
                  owner,
                  repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
                core.info(`Updated label: ${label.name}`);
              }
            }
