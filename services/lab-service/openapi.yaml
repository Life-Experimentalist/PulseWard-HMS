openapi: 3.0.0
info:
  title: Lab Service API
  description: API for managing lab tests and results in the PulseWard Hospital Management System.
  version: 1.0.0
servers:
  - url: http://localhost:5000/api/lab
paths:
  /tests:
    get:
      summary: Retrieve a list of lab tests
      responses:
        "200":
          description: A list of lab tests
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: "test123"
                    name:
                      type: string
                      example: "Complete Blood Count"
                    description:
                      type: string
                      example: "A test to evaluate overall health and detect a variety of disorders."
                    price:
                      type: number
                      format: float
                      example: 50.0
    post:
      summary: Create a new lab test
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Complete Blood Count"
                description:
                  type: string
                  example: "A test to evaluate overall health and detect a variety of disorders."
                price:
                  type: number
                  format: float
                  example: 50.0
      responses:
        "201":
          description: Lab test created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: "test123"
  /tests/{id}:
    get:
      summary: Retrieve a specific lab test by ID
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the lab test
          schema:
            type: string
            example: "test123"
      responses:
        "200":
          description: Lab test details
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: "test123"
                  name:
                    type: string
                    example: "Complete Blood Count"
                  description:
                    type: string
                    example: "A test to evaluate overall health and detect a variety of disorders."
                  price:
                    type: number
                    format: float
                    example: 50.0
        "404":
          description: Lab test not found
    put:
      summary: Update a lab test
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the lab test
          schema:
            type: string
            example: "test123"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Complete Blood Count"
                description:
                  type: string
                  example: "A test to evaluate overall health and detect a variety of disorders."
                price:
                  type: number
                  format: float
                  example: 50.0
      responses:
        "200":
          description: Lab test updated successfully
        "404":
          description: Lab test not found
    delete:
      summary: Delete a lab test
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the lab test
          schema:
            type: string
            example: "test123"
      responses:
        "204":
          description: Lab test deleted successfully
        "404":
          description: Lab test not found
