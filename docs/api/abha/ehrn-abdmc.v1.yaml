      operationId: post-v3-profile-login-request-otp
      description: >-
        Submit Aadhaar#, mobile# or ABHA# and generate OTP.


        ### Use cases

        1. Fetch ABHA using Aadhaar

        2. Fetch ABHA using ABHA linked Mobile#

        3. Verify ABHA# using Aadhaar

        4. Verify ABHA# using ABHA linked Mobile#


        ### Note to developers

        1. In case of Aadhaar#, the scope should include abha-login &
        aadhaar-verify, loginHint=aadhaar

        2. In case of mobile#, the scope should include abha-login &
        mobile-verify, loginHint=mobile

        3. In case of ABHA number verification, the scope should include
        abha-login & aadhaar-verify, loginHint=abha-number
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              x-examples:
                Example 1:
                  scope:
                    - abha-login
                    - aadhaar-verify
                  loginHint: aadhaar
                  loginId: "335852986321"
                  otpSystem: aadhaar
              properties:
                scope:
                  type: array
                  description: >-
                    Use enums as required for different requests.Order of items
                    is important
                  items:
                    type: string
                    enum:
                      - abha-login
                      - abha-profile
                      - aadhaar-verify
                      - mobile-verify
                      - email-verify
                      - password-verify
                      - change-password
                      - search-abha
                      - re-kyc
                loginHint:
                  type: string
                  enum:
                    - aadhaar
                    - mobile
                    - abha-number
                    - email
                    - password
                    - index
                otpSystem:
                  type: string
                  enum:
                    - aadhaar
                    - abdm
                  description: "If scope=aadhaar-verify, use aadhaar: Use abdm otherwise"
                loginId:
                  type: string
                  description: >-
                    Aadhaar#, mobile# or abha# based on the value selected in
                    loginhint
                txnId:
                  type: string
                  x-stoplight:
                    id: 8l88b0qtbpgw4
                  format: uuid
                  description: txnId received in /profile/account/abha/search API
            examples:
              Fetch ABHA with Aadhaar:
                value:
                  scope:
                    - abha-login
                    - aadhaar-verify
                  loginHint: aadhaar
                  loginId: "915673950224"
                  otpSystem: aadhaar
              Fetch ABHA with Abha linked mobile#:
                value:
                  scope:
                    - abha-login
                    - search-abha
                    - mobile-verify
                  loginHint: index
                  loginId: "1"
                  otpSystem: abdm
                  txnId: fae26b9b-ace5-4a61-a48a-2a891997a1f9
              Verify ABHA# with Aadhaar:
                value:
                  scope:
                    - abha-login
                    - aadhaar-verify
                  loginHint: abha-number
                  loginId: 91-7395-0224-6280
                  otpSystem: aadhaar
              Verify ABHA# with Mobile#:
                value:
                  scope:
                    - abha-login
                    - mobile-verify
                  loginHint: abha-number
                  loginId: 91-7395-0224-6280
                  otpSystem: abdm
